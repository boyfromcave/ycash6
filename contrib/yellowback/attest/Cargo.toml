[package]
name = "yellowback-attest"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "Ycash Yellowback attestor agent: attest (poll, yed_signattestation, publish) and subscribe (gossip -> yed_addattestation)"
publish = false

[[bin]]
name = "yellowback-attest"
path = "src/main.rs"

[dependencies]
# Exact pins (plan §5: pinned by PR like the toolchain). Cargo.lock is committed; `cargo build --locked`.
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
iroh-gossip = { version = "=0.101.0", default-features = false, features = ["net"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
# The process-wide TLS provider (ring, the one iroh uses) is installed once at startup; see tls.rs.
rustls = { version = "=0.23.44", default-features = false, features = ["ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.6"
clap = { version = "=4.6.6", features = ["derive"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
hex = "=0.4.3"
anyhow = "=1.0.104"
n0-future = "=0.3.2"
bytes = "=1.12.1"

[dev-dependencies]
tiny_http = "=0.12.0"
tempfile = "=3.27.0"
