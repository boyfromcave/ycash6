[tool.poetry]
name = "ycash-metrics"
version = "0.1.0"
description = "Ycash Metrics"
authors = [
    "Jack Grigg <jack@electriccoin.co>",
    "Daira Hopwood <daira@jacaranda.org>",
    "Kris Nuttycombe <kris@nutty.land>",
]
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/ycashfoundation/ycash/"
repository = "https://github.com/ycashfoundation/ycash/"
documentation = "https://github.com/ycashfoundation/ycash/"
classifiers = [
    "Private :: Do Not Upload",
]
packages = [
    { include = "supply_check" }
]

[tool.poetry.dependencies]
python = "^3.7"
slick-bitcoinrpc = "0.1.4"
progressbar2 = "4.2.0"
ujson = ">=5.13.0"  # transitive via slick-bitcoinrpc; GHSA-3j69-69wj-xqx2, GHSA-c38f-wx89-p2xg, GHSA-c8rr-9gxc-jprv, GHSA-wgvc-ghv9-3pmm

[tool.poetry.scripts]
supply-check = "supply_check:main"

