# OSV-Scanner accepted vulnerabilities (the `osv-scanner` job of .github/workflows/secops.yml;
# SECURITY-CI.md "Accepting a finding"). Every entry has a reason and an ignoreUntil at most
# 90 days out: on that date the finding fails the scan again and is re-triaged.
# Triaged 2026-10-23. The root Cargo.lock is not bumped here: it is in the frozen set
# (qa/yellowback-frozen-files.txt) and the nightly stock-reference job requires its crates-io set
# to equal branch ycash6-stock's (yellowback-tests.yml, "Check out the stock 6.20.0 tree"), so a
# lock bump is a deliberate change to both branches, not part of the CI setup.

# --- Cargo.lock (the node's Rust library) and depends/patches/native_cxxbridge/Cargo.lock ---

[[IgnoredVulns]]
id = "RUSTSEC-2026-0202"
ignoreUntil = 2027-01-21T00:00:00Z
reason = "cxx 1.0.194: let_cxx_string! is unsound on a C++ exception. The node never uses let_cxx_string! (no hit in src/), and cxx must stay at the version of the cxxbridge code generator depends builds (depends/packages/native_cxxbridge.mk 1.0.194); the fix is a coordinated depends bump (cxx + native_cxxbridge + its vendored lock), not a lockfile edit."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0190"
ignoreUntil = 2027-01-21T00:00:00Z
reason = "anyhow 1.0.102 (Error::downcast_mut unsound; fixed 1.0.103), in Cargo.lock and the cxxbridge build tool's lock: no code here calls downcast_mut (no hit in src/rust). The root lock is frozen and must match ycash6-stock's crates-io set (header); bump both together with the cxx depends bump."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0204"
ignoreUntil = 2027-01-21T00:00:00Z
reason = "crossbeam-epoch 0.9.18 (invalid pointer dereference in the fmt::Pointer impl of Atomic/Shared; fixed 0.9.20): reached only through rayon (bellman proving), which never formats those pointers. The root lock is frozen and must match ycash6-stock's crates-io set (header)."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0214"
ignoreUntil = 2027-01-21T00:00:00Z
reason = "gumdrop 0.8.1 is unmaintained (no vulnerability): the argument parser of the node's Rust helper binaries; no maintained drop-in yet. Informational."

[[IgnoredVulns]]
