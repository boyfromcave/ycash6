[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-01-25T00:00:00Z
reason = "Cargo.lock (block-buffer 0.10.4 and 0.11.0-rc.3, the node's Rust library) and contrib/yellowback/attest/Cargo.lock (0.10.4; its 0.12.1 is fixed). GHSA-qwgh-2vcv-g2f7 (moderate, GitHub-only, not in the RustSec database cargo-deny reads): a panic caught inside a digest's compress callback can leave block-buffer's cursor out of range, so a later use of the same buffer reads or writes out of bounds. Fixed only in 0.12.1 (the digest 0.11 line); the digest 0.10 line, which every released sha2/sha3/blake2 still uses, has no fixed release. Unreachable in ycashd: the Rust library builds with panic = 'abort' (Cargo.toml [profile.release]), so no panic is ever caught, and neither src/rust nor the attestor calls catch_unwind. Revisit when the RustCrypto hashes ship on digest 0.11."
