name: CI skip

on:
  # We use `pull_request_target` to have access to the necessary secrets to
  # create the commit status in PRs created from forks. This workflow never
  # checks out, fetches or runs anything from the PR: the changed paths come
  # from the REST API (`GET /repos/{owner}/{repo}/pulls/{number}/files`, the
  # same merge-base diff `git diff base...head` gives), and the status is
  # posted on the head SHA taken from the event payload. Ycash (2026-10-24):
  # replaces upstream's `git fetch` of the fork's commits (CodeQL
  # actions/untrusted-checkout/critical), which put PR-controlled objects in
  # a privileged job's working copy.
  pull_request_target:
    # Ycash (2026-10-06): scoped to upstream zcashd's own branch. This fork has no `master` PRs;
    # the companion of ci.yml (see its note), and pull_request_target needs no wider reach than that.
    branches: master
    # Any update here needs to be done for the `no-ci-required` step (see below),
    # and mirrored into `ci.yml`.
    paths:
      # Documentation.
      - 'contrib/debian/copyright'
      - 'doc/**'
      - '**.md'
      - 'COPYING'
      - 'INSTALL'

permissions:
  contents: read
  # Listing the PR's changed files (pulls/{number}/files).
  pull-requests: read
  statuses: write

jobs:
  required-pass:
    name: Bypass required-pass steps
    runs-on: ubuntu-latest

    steps:
      - name: Check whether the changes are only to the set of filtered paths
        id: no-ci-required
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const paths = [
              /^contrib\/debian\/copyright$/,
              /^doc\/.*/,
              /.*\.md$/,
              /^COPYING$/,
              /^INSTALL$/,
            ]
            const files = await github.paginate("GET /repos/{owner}/{repo}/pulls/{pull_number}/files", {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            })
            if (files.length === 0) {
              core.setFailed("no changed files listed for this PR")
              return
            }
            // The endpoint lists at most 3000 files; a PR at that cap is never treated as docs-only.
            // A rename counts both its old and its new path, so moving a source file under doc/
            // is not docs-only either.
            const names = files.flatMap((f) => f.previous_filename ? [f.filename, f.previous_filename] : [f.filename])
            const verified = files.length < 3000 && names.every((f) => paths.some((re) => re.test(f)))
            core.setOutput("result", verified ? "verified" : "skipped")

      - name: Submit required-passed status
        if: ${{ !cancelled() && steps.no-ci-required.outputs.result == 'verified' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.request("POST /repos/{owner}/{repo}/statuses/{sha}", {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: "success",
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: "Finished",
              context: "CI / Required status checks"
            })
