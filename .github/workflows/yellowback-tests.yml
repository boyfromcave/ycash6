# ycashd 6.20.0 port of the Yellowback CI (ycash6, branch feature/yellowback). Copied from ycash-dd's
# feature/yellowback-price-attest on 2026-09-30 and adapted: baseline = tag ycash6-baseline, the
# audit gates are qa/yellowback-audit.sh, ZCASHD replaces BITCOIND. Every job is on since 2026-10-01
# (plan Phase 6: each one's steps green locally on 6.20.0 first; `audit` and `python` since Phase 4).
#
# Runner: ubuntu-22.04 for every job, as upstream's own .github/workflows/ci.yml builds natively
# (its tier-1 `ubuntu-22.04` row, no container, no apt packages) and doc/book/src/user/
# platform-support.md lists Ubuntu 22.04 as tier 1. Upstream bumped depends to LLVM 22 (9a83cdcf0)
# and the next day dropped only Debian 11 (glibc 2.31) as unbuildable (5bde251fd), keeping 22.04
# (glibc 2.35) and Debian 12 (2.36) native, so native_clang.mk's "its output requires glibc 2.38"
# is not upstream's experience. LEGACY_GLIBC=1 is not used: it swaps in Clang 18.1.8 for building
# INSIDE an Ubuntu 18.04 image (contrib/legacy-glibc-build/README.md), which would test a toolchain
# no release uses. apt's lcov on 22.04 is 1.15, the version the coverage step is written for.
# libtinfo5 is no longer installed from apt: depends stages its own (native_libtinfo5.mk, a
# dependency of native_clang on Linux), so moving to ubuntu-24.04 -- the fallback if a 22.04 link
# ever reports a GLIBC_2.38 symbol -- is a runs-on change only.
name: yellowback tests

# Fork-local CI for Ycash Yellowback (YED). Upstream Ycash runs no tests in CI (book.yml only).
# The same zcutil/build.sh a developer runs locally, so a green CI and a green laptop mean the
# same thing. Layout per the workspace plan (docs/plans/yellowback-v2-development-plan.md, §6.0
# item 6): the push tier blocks merges -- since 2026-10-06 the old `main` job is `build` (once),
# `unit`, `sidecars` and the sharded `functional` matrix, beside `audit`, `agent`, `python` and
# `lint`, summarised by the one `gate` check ("push tier"); `nightly`, `weekly-fuzz` and the three
# variant builds `lockorder`, `sanitizers` and `coverage` (Phase 3, P6) open an issue.
# Shared steps live in .github/actions/yellowback-prereqs (apt, Python 3.11, pinned pip packages
# of qa/yellowback-ci-requirements.txt) and .github/actions/yellowback-depends (the depends, cargo
# home and cargo target caches, with why each key is what it is).
#
# Functional scripts are listed by name: rpc-tests.py does not glob. YELLOWBACK_SCRIPTS is the
# current phase's list (Phase 3: yellowback_index yellowback_activation yellowback_rpc_contract;
# yellowback_mining and yellowback_enforcement join as Phases 4-5 land; the wallet-flow scripts
# return at Phase 6, N26). SANITIZER_SCRIPTS is the subset the sanitizers job runs (§6.0 item 6:
# yellowback_index yellowback_enforcement yellowback_mining once the latter two exist).
# STOCK_BASELINE is the inherited Ycash suite that must keep passing against
# the fork binary without -yellowback (P5); the 6.20.0 list and why every other inherited script
# is out are in doc/yellowback-baseline.md "Inherited functional suite at the pin".

# Triggers (CI/CD design of 2026-10-06, wt/BRIEFING-upgrade.md; upgrade plan "CI/CD"):
#   push / pull_request on the node-line branches (one list, the `node-line-branches` anchor below):
#     the push tier -- build once, unit tests, the functional suites sharded over one build
#     artifact, the audit, the agent crate, the Python checks, lint. Target 25 min warm.
#   schedule: ONLY the `schedule-fanout` job. GitHub runs a scheduled workflow from the DEFAULT
#     branch's copy of this file and checks out the default branch (feature/yellowback here), so
#     a nightly defined on harden/yellowback or upgrade/vault never ran on those branches. The
#     dispatcher instead starts this workflow by workflow_dispatch on every branch of the anchor
#     (tier nightly at 03:00, weekly on Sunday 04:00), so each branch runs ITS OWN nightly. It
#     takes effect once the default branch carries this file (or the default branch is switched
#     to harden/yellowback for the duration of the hardening plan).
#   workflow_dispatch, input `tier`: all (push + nightly; the default, as a dispatch ran before),
#     push, nightly (variants, the long suites, the cross-repo runs), weekly (fuzzing). Any ref.
# Every job has timeout-minutes; superseded push and pull_request runs are cancelled.
on:
  push:
    branches: &node-line-branches
      - harden/yellowback
      - upgrade/vault
      - feature/yellowback
  pull_request:
    branches: *node-line-branches
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Which tier to run: all (push + nightly), push, nightly (variants and long suites) or weekly (fuzz, every Yellowback* and Vault* target, about 4 hours)'
        type: choice
        options: [all, push, nightly, weekly]
        default: all

permissions:
  contents: read

concurrency:
  # Push and pull_request runs of one ref supersede each other; every dispatched run is its own.
  group: yellowback-tests-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # Plan section 6.0 item 6's list for Phase 6 and after, plus yellowback_hardening (Phase 8,
  # written after that list). Each phase registered its script in qa/pull-tester/rpc-tests.py but
  # this variable was not updated with it, so mining, enforcement, stock_node and hardening — the
  # soft fork's own safety evidence among them — were never run by CI. Added 2026-09-11.
  # yellowback_quote joined on 2026-09-22: the quote agent reads TOML with the stdlib tomllib
  # (Python >= 3.11) and the main and nightly jobs ran ubuntu-22.04's 3.10, which is also why the
  # nightly devnet role presets died at "quote agents did not publish" (the agents crashed on
  # import). Both jobs now take 3.11 from actions/setup-python and pyzmq/simplejson from pip.
  #
  # The three yellowback_attest* scripts joined the list on 2026-09-20. They are the whole of the
  # v3 A1-A3 test evidence and each phase registered its script in qa/pull-tester/rpc-tests.py,
  # but this variable was not updated with them and the files were not executable (the runner
  # exec's them directly, so an un-chmodded script dies with PermissionError before the framework
  # starts) -- the identical omission recorded above for mining/enforcement/stock_node/hardening
  # on 2026-09-11, repeated for v3. The audit job now greps for both halves so it cannot recur.
  # ycash6 port (plan Phase 4): every BASE_SCRIPTS yellowback script of qa/pull-tester/rpc-tests.py,
  # i.e. the v4.5.0 list plus yellowback_wallet_lifecycle and the port's yellowback_framework_smoke;
  # yellowback_reorg_stress is retired (plan P-7). The four EXTENDED ones run in nightly or not at all.
  # yellowback_interm joined on 2026-10-07 (in-term claims IT-1..IT-6, ported from ycash-dd 37f202f80).
  YELLOWBACK_SCRIPTS: yellowback_index yellowback_upgrade yellowback_mining yellowback_lifecycle yellowback_claim yellowback_interm yellowback_void_mint yellowback_mint_armed yellowback_pricefeed yellowback_wallet_restore yellowback_sapling yellowback_stock_node yellowback_rpc_contract yellowback_hardening yellowback_attest yellowback_attest_wallet yellowback_quote yellowback_stratum yellowback_chainviz yellowback_wallet_lifecycle yellowback_framework_smoke yellowback_fee yellowback_mempool_limits yellowback_wr_flags vault_upgrade vault_rpc vault_rpc_contract vault_primitive vault_slashing vault_bridge
  SANITIZER_SCRIPTS: yellowback_index
  # yellowback_stratum drives the real pool software: boyfromcave/yolo (Rust), checked out at this
  # commit and built in the main job, exported as YOLO_BIN. Without the binary the script SKIPs.
  YOLO_REPO: boyfromcave/yolo
  YOLO_COMMIT: dc9c57a671e37821c21932b4859f9d28800d27e9
  # yellowback_chainviz drives the chain observer: boyfromcave/chain-viz (Rust), checked out at
  # this commit (bump by PR, audit I-5) and built --locked the same way, exported as CHAINVIZ_BIN.
  # Since 2026-10-06 its harden/yellowback build (H5: rpcversion 4 fields), the pin ycash-dd's CI
  # uses; it must be pushed to boyfromcave/chain-viz before this resolves. yolo: its main.
  CHAINVIZ_REPO: boyfromcave/chain-viz
  # On the upgrade line: chain-viz's upgrade/vault (rpcversion 5 tolerant, set/vault panels; upgrade
  # plan P6), the build yellowback_chainviz passed against on ycash-dd. It must be pushed to
  # boyfromcave/chain-viz before this pin resolves.
  CHAINVIZ_COMMIT: b4eb44b568555ae9482a7245f6c9514f9bb10fc3
  # The lightwalletd fork the nightly drives, at a commit (audit E-6; bump by PR when it moves),
  # and the Go toolchain it builds with, verified against go.dev's published sha256.
  LWD_REPO: boyfromcave/lightwalletd
  # On the upgrade line: lightwalletd-dd's upgrade/vault build (rpcversion 5, the vault read RPCs;
  # upgrade plan P6), as ycash-dd's CI pins it; it must be pushed before this resolves.
  LWD_COMMIT: ce5f40eda84f4b4c880debb01ff1588d0fea3413
  GO_VERSION: 1.24.7
  GO_SHA256: da18191ddb7db8a9339816f3e2b54bdded8047cdc2a5d67059478f8d1595c43f
  # The cargo-audit release the agent job installs (audit I-7); bump by PR.
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_DENY_VERSION: 0.20.2   # 0.18.3 cannot parse the CVSS 4.0 advisories in the RustSec DB (2026-10-02)
  # The inherited scripts green twice against the stock 6.20.0 pin (branch ycash6-stock, recorded
  # 2026-09-30; table and failure classes in doc/yellowback-baseline.md "Inherited functional suite
  # at the pin"). 42 entries: 39 BASE_SCRIPTS, zmq_test and two EXTENDED. v4.5.0 ran 7 and
  # excluded 4: six of the 7 carry over, mempool_tx_expiry drops out (its explicit 0.0001 fee is
  # above 6.20.0's 4x-conventional cap of 0.00004); two of the 4 exclusions (invalidateblock,
  # getblocktemplate_longpoll) are green now, getblocktemplate_proposals (Bitcoin-format block)
  # and p2p-acceptblock (mininode protocol 170006 < 270013) stay out. The other inherited scripts
  # fail at the pin on upstream-Zcash assumptions in the harness (branch ids, fees, mininode,
  # addresses, caches, branding) or on the three pin defects recorded there; none is the
  # overlay's to fix. getblocktemplate_longpoll passes but is left out: its random_transaction(...,
  # min_fee=0.0, ...) draws a zero fee 1 time in 21 and 6.20.0's relay policy refuses it, on the
  # stock and the fork binary alike (a test flake, not the overlay's; 41 entries).
  #
  # zmq_test is named, so rpc-tests.py runs it whatever --nozmq says (--nozmq only trims the
  # default, unnamed list). The runs of this list therefore drop --nozmq, so rpc-tests.py's own
  # `import zmq` check fails early instead of zmq_test dying mid-run, and every job that runs it
  # installs pyzmq (depends builds zeromq, so ENABLE_ZMQ is on).
  #
  # `txn_doublespend.py --mineblock` is one ALL_SCRIPTS entry with an argument: an unquoted
  # space-separated variable would split it and hand `--mineblock` to every script as a pass-on
  # flag, so it is its own variable, always passed quoted.
  STOCK_BASELINE: wallet walletbackup fundrawtransaction reorg_limit getrawtransaction_insight spentindex timestampindex key_import_export zapwallettxes feature_logging feature_walletfile rawtransactions threeofthreerestore rest wallet_deprecation nodehandling reindex listtransactions merkle_blocks sapling_rewind_check sapling_v4_value_balance wallet_parsing_amounts wallet_zero_value wallet_broadcast proxy_test errors keypool txn_doublespend mempool_reorg mempool_resurrect_test mempool_spendcoinbase regtest_signrawtransaction httpbasics multi_rpc blockchain getmininginfo decodescript getchaintips invalidateblock zmq_test
  STOCK_BASELINE_MINEBLOCK: txn_doublespend.py --mineblock
  # The upgrade line's audit compares against the other node line and the workspace generator:
  # ycash-dd (public) at the same branch, and boyfromcave/yellowback at a commit that carries
  # scripts/extract_spec.py's upgrade mode (382d1dc, findings (39)/(44); bump by PR).
  OTHER_LINE_REPO: boyfromcave/ycash-dd
  YB_WORKSPACE_REPO: boyfromcave/yellowback
  # A plan edit in the workspace that changes a generated copy (doc/yellowback-spec.md,
  # doc/yellowback-rpc-contract.json) needs this pin bumped, to a pushed workspace commit,
  # in the same push as the regenerated copy: otherwise the audit compares against the old plan.
  YB_WORKSPACE_COMMIT: 9657d9cfdb5e4370fae04b01993e981329a8f6cb

jobs:
  # The scheduled entry point: one workflow_dispatch per node-line branch (see the trigger notes at
  # the top). A branch whose copy of this file does not accept `tier` yet (feature/yellowback until
  # this file is merged back there) is skipped with a warning, never a red run.
  schedule-fanout:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: write
    strategy:
      fail-fast: false
      matrix:
        branch: *node-line-branches
    steps:
      - name: Dispatch this workflow on the branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ matrix.branch }}
          TIER: ${{ github.event.schedule == '0 4 * * 0' && 'weekly' || 'nightly' }}
        run: |
          gh workflow run yellowback-tests.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f tier="$TIER" \
            || echo "::warning::could not dispatch the $TIER tier on $BRANCH (no such branch, or its copy of this workflow has no tier input)"

  # ---------------------------------------------------------------------------------------------
  # Push tier: build once, test many. `build` compiles ycashd, ycash-cli, ycash-tx and test_bitcoin
  # once and hands them to `unit` and to every `functional` shard as one artifact; `sidecars` builds
  # the two Rust sidecars (yolo, chain-viz) in parallel with it. Nothing is rebuilt per shard.
  build:
    if: github.event_name != 'schedule' && contains(fromJSON('["push", "all"]'), inputs.tier || 'push')
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/yellowback-prereqs
        with:
          python: 'false'
      - id: inputs
        uses: ./.github/actions/yellowback-depends
        with:
          save-target: 'true'
      - name: Cache ccache (C++ objects)
        # depends builds ccache 4.12 and config.site hands it to configure (CCACHE=); its default
        # directory on Linux is ~/.cache/ccache. One entry per commit; restored by branch, then
        # by whatever this branch can see (its own and the default branch's).
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-build-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-build-${{ github.ref_name }}-
            ccache-${{ runner.os }}-build-
      # No zk parameters: 6.20.0 bundles the Sapling parameters and the Sprout verifying key in the
      # binary, and zcutil/fetch-params.sh only prints a deprecation notice and exits 0 (the
      # params cache and fetch steps of the v4.5.0 copy are gone with it).
      - name: Build ycashd
        run: ./zcutil/build.sh -j"$(nproc)"
      - name: ccache statistics
        if: always()
        run: depends/x86_64-pc-linux-gnu/native/bin/ccache --show-stats || true
      - name: Pack the build artifact
        # tar keeps the executable bits (upload-artifact does not). tests_config.ini is configure's
        # output that rpc-tests.py reads (SRCDIR/BUILDDIR are this same workspace path on every
        # runner of this repository, so the shards can use it as is).
        run: |
          tar czf "$RUNNER_TEMP/node-bin.tgz" src/ycashd src/ycash-cli src/ycash-tx src/test/test_bitcoin \
            qa/pull-tester/tests_config.ini
          ls -l "$RUNNER_TEMP/node-bin.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-bin
          path: ${{ runner.temp }}/node-bin.tgz
          retention-days: 3
          if-no-files-found: error

  unit:
    needs: build
    if: github.event_name != 'schedule' && contains(fromJSON('["push", "all"]'), inputs.tier || 'push')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-bin
          path: ${{ runner.temp }}
      - run: tar xzf "$RUNNER_TEMP/node-bin.tgz"
      - name: Unit tests (the whole test_bitcoin, P5)
        # Not only yellowback_*: the Phase 3 hooks sit in files that miner_tests, main_tests,
        # mempool_tests and rpc_tests cover.
        run: src/test/test_bitcoin --log_level=test_suite

  # yellowback_stratum drives the real pool software (boyfromcave/yolo) and yellowback_chainviz the
  # chain observer (boyfromcave/chain-viz), both at the commits pinned in env. Checked out into
  # this job's workspace WITHOUT the node checkout around them, so neither the node's
  # rust-toolchain.toml nor depends' .cargo/config (vendored crates-io) applies -- the reason the
  # old main job built them from copies under $RUNNER_TEMP (run 36444762343). --locked at the pins
  # (audit I-5); the cache is keyed on the two pins, which fix both Cargo.locks.
  sidecars:
    if: github.event_name != 'schedule' && contains(fromJSON('["push", "all"]'), inputs.tier || 'push')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.YOLO_REPO }}
          ref: ${{ env.YOLO_COMMIT }}
          path: yolo
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.CHAINVIZ_REPO }}
          ref: ${{ env.CHAINVIZ_COMMIT }}
          path: chain-viz
          persist-credentials: false
      - name: Install a Rust toolchain
        # SHA-pinned toolchain action instead of `curl https://sh.rustup.rs | sh` (audit I-4).
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1 (master, 2026-10-01)
        with:
          toolchain: stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            yolo/target
            chain-viz/target
          key: sidecars-${{ runner.os }}-${{ env.YOLO_COMMIT }}-${{ env.CHAINVIZ_COMMIT }}
          restore-keys: |
            sidecars-${{ runner.os }}-
      - name: Build yolo
        # --features regtest: yellowback_stratum.py's negative cell passes --text --no-flags,
        # which yolo accepts only in a regtest-feature build (yolo audit H-6).
        working-directory: yolo
        run: |
          rustup show active-toolchain
          cargo build --release --locked --features regtest
          ./target/release/yolo --version
      - name: Build chain-viz
        working-directory: chain-viz
        run: |
          cargo build --release --locked
          ./target/release/chain-viz --version
      - name: Pack the sidecars
        run: tar czf "$RUNNER_TEMP/sidecars.tgz" -C yolo/target/release yolo -C "$GITHUB_WORKSPACE/chain-viz/target/release" chain-viz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sidecars
          path: ${{ runner.temp }}/sidecars.tgz
          retention-days: 3
          if-no-files-found: error

  # The merge-gate functional lists, sharded round-robin over one build artifact. yellowback shards
  # run YELLOWBACK_SCRIPTS with --nozmq; stock shards run STOCK_BASELINE (it names zmq_test, so no
  # --nozmq) and the last one also the quoted STOCK_BASELINE_MINEBLOCK entry. A shard whose share
  # includes yellowback_stratum / yellowback_chainviz fails when the sidecar binary is missing:
  # those scripts would SKIP and count as passes (audit I-3).
  functional:
    name: functional ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.of }}
    needs: [build, sidecars]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'schedule' && contains(fromJSON('["push", "all"]'), inputs.tier || 'push') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: yellowback, shard: 1, of: 4}
          - {suite: yellowback, shard: 2, of: 4}
          - {suite: yellowback, shard: 3, of: 4}
          - {suite: yellowback, shard: 4, of: 4}
          - {suite: stock, shard: 1, of: 2}
          - {suite: stock, shard: 2, of: 2}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/yellowback-prereqs
        with:
          apt: 'false'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-bin
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.suite == 'yellowback' && needs.sidecars.result == 'success'
        with:
          name: sidecars
          path: ${{ runner.temp }}
      - name: Unpack
        run: |
          tar xzf "$RUNNER_TEMP/node-bin.tgz"
          if [ -f "$RUNNER_TEMP/sidecars.tgz" ]; then
            mkdir -p "$RUNNER_TEMP/sidecars" && tar xzf "$RUNNER_TEMP/sidecars.tgz" -C "$RUNNER_TEMP/sidecars"
            echo "YOLO_BIN=$RUNNER_TEMP/sidecars/yolo" >> "$GITHUB_ENV"
            echo "CHAINVIZ_BIN=$RUNNER_TEMP/sidecars/chain-viz" >> "$GITHUB_ENV"
          fi
      - name: Functional tests (this shard)
        # TMPDIR keeps every test's mkdtemp() under one directory we own, so the log upload below
        # does not have to glob all of /tmp (root-only /tmp/snap-private-tmp on the GitHub runners
        # makes upload-artifact fail with EACCES). --nocleanup is forwarded to every script:
        # without it test_framework.py rmtree()s its tmpdir even when the test fails.
        # No REF_YCASHD here: this merge gate builds no stock binary, so node 1 of the standard
        # topology (yellowback_stock_node, yellowback_enforcement's adversary) is the fork binary
        # WITHOUT -yellowback -- the P9 fallback the scripts print. The real stock-6.20.0 runs
        # (ycash6-stock build: stockparity, stock_node, the demonstration) are the nightly's.
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
          OF: ${{ matrix.of }}
        run: |
          mkdir -p "$TMPDIR"
          test -z "${REF_YCASHD:-}"
          case "$SUITE" in
            yellowback) all=$YELLOWBACK_SCRIPTS; flags=(--nozmq) ;;
            stock)      all=$STOCK_BASELINE;     flags=() ;;
          esac
          sel=(); i=0
          for n in $all; do
            [ $((i % OF)) -eq $((SHARD - 1)) ] && sel+=("$n")
            i=$((i + 1))
          done
          if [ "$SUITE" = stock ] && [ "$SHARD" = "$OF" ]; then sel+=("$STOCK_BASELINE_MINEBLOCK"); fi
          for n in "${sel[@]}"; do
            case "$n" in
              yellowback_stratum)  test -x "${YOLO_BIN:-}"     || { echo "yolo was not built (sidecars job); $n would SKIP"; exit 1; } ;;
              yellowback_chainviz) test -x "${CHAINVIZ_BIN:-}" || { echo "chain-viz was not built (sidecars job); $n would SKIP"; exit 1; } ;;
            esac
          done
          echo "shard $SHARD/$OF of $SUITE: ${sel[*]}"
          qa/pull-tester/rpc-tests.py -j4 "${flags[@]}" --nocleanup "${sel[@]}"
      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yellowback-test-logs-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/yellowback-tests/**/node*/regtest/debug.log
          if-no-files-found: ignore

  # Formatting and workflow lint (push tier). rustfmt over the node's own Rust (src/rust) with the
  # toolchain the build pins (rust-toolchain.toml); actionlint over every workflow (.github/actionlint.yaml). Clippy is not
  # run on the node's Rust here: it is upstream's crate, a clippy pass costs a second full
  # compile, and the crates the Yellowback overlay changes (zcash_protocol & co.) are clippy-gated
  # in librustzcash6's own CI.
  lint:
    if: github.event_name != 'schedule' && contains(fromJSON('["push", "all"]'), inputs.tier || 'push')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Read the toolchain pin (rust-toolchain.toml)
        id: toolchain
        run: |
          chan=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$chan"
          echo "channel=$chan" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1 (master, 2026-10-01)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - name: rustfmt (src/rust)
        # rustfmt directly on the two crate roots of Cargo.toml (it follows their `mod` items), not
        # `cargo fmt`: cargo would resolve the git dependencies first, and formatting needs none.
        run: |
          ed=$(sed -n 's/^edition = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$ed"
          rustfmt --check --edition "$ed" src/rust/src/lib.rs src/rust/bin/wallet_tool.rs
      - name: actionlint
        if: ${{ !cancelled() }}
        run: |
          curl -sSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          # Every workflow, with the ignores of .github/actionlint.yaml (shellcheck is on the runner image).
          "$RUNNER_TEMP/actionlint" -color

  # One required check for branch protection: green only when every push-tier job is.
  gate:
    name: push tier
    needs: [build, unit, sidecars, functional, audit, agent, python, lint]
    if: ${{ always() && github.event_name != 'schedule' && contains(fromJSON('["push", "all"]'), inputs.tier || 'push') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Every push-tier job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')
          test -z "$bad" || { echo "not green: $bad"; exit 1; }

  audit:
    if: github.event_name != 'schedule' && contains(fromJSON('["push", "all"]'), inputs.tier || 'push')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch the baseline tag
        # ycashd 6.20.0 port (docs/plans/yellowback-ycash6-plan.md §2, decision P-4): every budget and
        # the frozen set are measured against the tag ycash6-baseline (= miodragpop's
        # dev-rebase-6.20.0 @ 040894344b + the miner anchor and harness baseline fixes). A missing tag
        # is an error, never a vacuous pass.
        run: |
          git fetch --no-tags origin +refs/tags/ycash6-baseline:refs/tags/ycash6-baseline
          git rev-parse --verify 'ycash6-baseline^{commit}'

      - name: Which line is this tree?
        # One workflow serves both node-line branches: the line is read from the tree, not the ref
        # (pull requests and up/* branches have their own ref names). src/vault/ exists only on
        # the network-upgrade line (UPGRADE_VAULT, upgrade plan §15).
        id: line
        run: |
          if [ -d src/vault ]; then line=upgrade; else line=harden; fi
          echo "line=$line" >> "$GITHUB_OUTPUT"
          echo "node line: $line"
          # The in-term line (upgrade/vault-in-term, in-term claims plan IT-7) is the upgrade line on a tree
          # whose node reports inTermClaims: its RPC contract is rpcversion 6, generated by the workspace's
          # in-term mode (as ycash-dd's qa/yellowback-audit.sh decides it).
          interm=0
          if [ "$line" = upgrade ] && grep -q '"inTermClaims"' src/rpc/yellowback.cpp; then interm=1; fi
          echo "interm=$interm" >> "$GITHUB_OUTPUT"
          echo "in-term claims: $interm"

      - name: Frozen set at zero delta and the line budgets (plan §2)
        # One script so the gate a developer runs locally is the gate CI runs. On the upgrade line
        # the frozen and budget legs are REPORT-ONLY (upgrade plan §7 G-9, §9): they print the
        # delta and the consensus review gate (the consensus-diff artifact below, two reviewers)
        # judges it; the script's rpcCvtTable leg still fails.
        env:
          LINE: ${{ steps.line.outputs.line }}
        run: |
          if [ "$LINE" = upgrade ]; then qa/yellowback-audit.sh --report-only ycash6-baseline
          else qa/yellowback-audit.sh ycash6-baseline; fi

      - name: Consensus-diff report for the two-reviewer gate (upgrade plan §7 G-9)
        # Every changed line under the consensus paths, against this line's pristine pin
        # (ycash6-legacy = miodragpop/ycash dev-rebase-6.20.0 @ 040894344b). The design's five
        # paths plus the three that 6.20.0's upgrade work also routes through the gate:
        # src/policy/ (finding (29)) and Cargo.toml / src/rust/ (the librustzcash6 repoint,
        # finding (23)). Uploaded as the artifact `consensus-diff`; the summary goes to the run page.
        if: steps.line.outputs.line == 'upgrade' && !cancelled()
        run: |
          git fetch --no-tags origin +refs/heads/ycash6-legacy:refs/remotes/origin/ycash6-legacy
          base=origin/ycash6-legacy
          paths="src/consensus/ src/script/ src/main.cpp src/primitives/ src/vault/ src/policy/ Cargo.toml src/rust/"
          out="$RUNNER_TEMP/consensus-diff"; mkdir -p "$out"
          # shellcheck disable=SC2086
          git diff -U0 "$base"...HEAD -- $paths > "$out/consensus.diff"
          # shellcheck disable=SC2086
          git diff --numstat "$base"...HEAD -- $paths > "$out/numstat.txt"
          {
            echo "## Consensus-diff report ($(git rev-parse --short HEAD) vs ycash6-legacy)"
            echo
            echo "Every line below needs two reviewers independent of its author, with the four-part check in the PR body (upgrade plan §7 G-9)."
            echo
            echo '| file | + | - |'; echo '|---|---:|---:|'
            awk '{printf "| %s | %s | %s |\n", $3, $1, $2}' "$out/numstat.txt"
            awk '{a+=$1; d+=$2} END {printf "| **total** | **%d** | **%d** |\n", a, d}' "$out/numstat.txt"
          } | tee "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$out/numstat.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.line.outputs.line == 'upgrade' && !cancelled()
        with:
          name: consensus-diff
          path: ${{ runner.temp }}/consensus-diff
          if-no-files-found: error

      - name: The DoS rule (upgrade line; encoded by function, not by line number)
        # The upgrade makes Yellowback and the vault primitive consensus (U-21): a BLOCK that breaks
        # one of their rules is rejected with DoS 100, while a MEMPOOL refusal is state-dependent
        # (a peer on another tip sees a different set state; findings (25), (24)) and is DoS 0.
        # Encoded over main.cpp's inserted lines by enclosing function (the hunk header):
        #   AcceptToMemoryPool   every inserted DoS is DoS(0
        #   ConnectBlock / CheckBlock / ContextualCheckBlock(Header) / CheckBlockHeader
        #                        every inserted vault/yellowback verdict is DoS(100
        #   `DoS(fMempool ? 0 : 100` is the one both-ways form (the vault timelock in CheckFinalTx)
        #   no Misbehaving( is ever inserted; anything else is printed for the reviewer.
        # And the verdict levels live in main.cpp only: src/vault/ and src/yellowback/ call no DoS.
        if: steps.line.outputs.line == 'upgrade' && !cancelled()
        run: |
          ! grep -n "DoS(\|Misbehaving(" src/vault/*.cpp src/vault/*.h src/yellowback/*.cpp src/yellowback/*.h | grep -v ':[0-9]*:[[:space:]]*\(//\|\*\)' || exit 1
          git diff -U0 ycash6-baseline...HEAD -- src/main.cpp | awk '
            /^@@/ { fn = ""; ctx = $0; sub(/^@@[^@]*@@ ?/, "", ctx); if (match(ctx, /[A-Za-z_][A-Za-z0-9_:]*\(/)) fn = substr(ctx, RSTART, RLENGTH - 1); next }
            /^\+\+\+/ { next }
            /^\+/ && /DoS\(|Misbehaving\(/ {
              line = substr($0, 2); gsub(/^[ \t]+/, "", line)
              if (line ~ /Misbehaving\(/) { print "FAIL (no ban entry point may be added): " fn ": " line; bad = 1; next }
              lvl = line; sub(/.*DoS\(/, "", lvl); sub(/,.*/, "", lvl)
              verdict = (line ~ /[Vv]ault|[Yy]ellowback|yb\.|ybBad/)
              if (fn ~ /AcceptToMemoryPool/) {
                if (lvl != "0") { print "FAIL (mempool refusals are state-dependent: DoS 0): " fn ": " line; bad = 1 } else print "ok   mempool  DoS 0   " fn ": " line
              } else if (fn ~ /^(ConnectBlock|CheckBlock|ContextualCheckBlock|ContextualCheckBlockHeader|CheckBlockHeader)$/ && verdict) {
                if (lvl != "100") { print "FAIL (a block breaking a consensus rule is DoS 100): " fn ": " line; bad = 1 } else print "ok   block    DoS 100 " fn ": " line
              } else if (lvl == "fMempool ? 0 : 100") {
                print "ok   both     0/100   " fn ": " line
              } else {
                print "note (reviewer)       " fn ": " line
              }
            }
            END { exit bad }'

      - name: Determinism of the vault primitive (src/vault)
        # Consensus code reads no clock, no randomness, no floating point and no configuration;
        # only the node glue (node.cpp/node.h) may touch the mempool. Comment lines are skipped.
        if: steps.line.outputs.line == 'upgrade' && !cancelled()
        run: |
          ! grep -nE 'GetTime|GetAdjustedTime|GetRand|insecure_rand|std::rand|random_device|mt19937|<chrono>|std::chrono|\bdouble\b|\bfloat\b|GetArg|GetBoolArg|mapArgs|pwalletMain' src/vault/*.cpp src/vault/*.h | grep -v ':[0-9]*:[[:space:]]*\(//\|\*\)' || exit 1
          ! grep -n 'mempool\.' src/vault/*.cpp src/vault/*.h | grep -vE '^src/vault/node\.(cpp|h):' | grep -v ':[0-9]*:[[:space:]]*\(//\|\*\)' || exit 1
          ! grep -nE 'evhttp|socket|\bconnect\(' src/vault/*.cpp src/vault/*.h | grep -v ':[0-9]*:[[:space:]]*\(//\|\*\)' || exit 1

      - name: Attribution and naming (both rules, encoded over the fork delta)
        # Attribution (owner rule 2026-10-01): every file the fork adds carries "The Ycash
        # developers"; an upstream file the fork modifies that has a copyright block carries a
        # Ycash line too; no existing copyright line is ever removed. Naming: the software is
        # Ycash (no "ycash6" in src/), and no DigiDollar/ydollar naming enters the code
        # (AGENTS.md rule 6; in code DigiDollar is allowed only in comments that cite the upstream file).
        if: ${{ !cancelled() }}
        run: |
          rc=0
          base=ycash6-baseline
          while read -r f; do
            grep -q 'The Ycash developers' "$f" || { echo "new file without the Ycash notice: $f"; rc=1; }
          done < <(git diff --name-only --diff-filter=A "$base" HEAD -- src qa contrib | grep -E '\.(cpp|h|c|py|sh|rs)$' | grep -v '^src/fuzzing/')
          while read -r f; do
            if grep -q 'Copyright' "$f" && ! grep -q 'Ycash developers' "$f"; then echo "modified upstream file without a Ycash line: $f"; rc=1; fi
          done < <(git diff --name-only --diff-filter=M "$base" HEAD -- src qa contrib | grep -E '\.(cpp|h|c|py|sh|rs)$')
          removed=$(git diff "$base" HEAD | grep -E '^-[^-].*Copyright' || true)
          [ -z "$removed" ] || { echo "copyright lines removed (never allowed):"; echo "$removed"; rc=1; }
          hits=$(git grep -n -i 'ycash6' -- src || true)
          [ -z "$hits" ] || { echo "'ycash6' in src/ (the software is Ycash):"; echo "$hits"; rc=1; }
          added=$(git diff "$base" HEAD -- src qa contrib doc | grep -E '^\+[^+]' || true)
          hits=$(printf '%s\n' "$added" | grep -E 'ydollar|YDollar|\byd_' || true)
          [ -z "$hits" ] || { echo "retired YDollar naming:"; echo "$hits"; rc=1; }
          # Code only (doc/ prose may name the retired `feature/digidollar` branch).
          hits=$(git diff "$base" HEAD -- src qa contrib | grep -E '^\+[^+]' | grep -E -i 'digidollar' | grep -vE '^\+[[:space:]]*(//|#|\*|/\*)' || true)
          [ -z "$hits" ] || { echo "DigiDollar naming outside a citing comment:"; echo "$hits"; rc=1; }
          exit $rc

      - name: Cross-line vectors (vault_vectors.json, yellowback_golden.json byte-identical to ycash-dd)
        # Both node lines carry identical behaviour (upgrade plan §9): the vault golden vector and
        # the Yellowback golden state must be the same bytes on ycash-dd at the same branch (the
        # PR's base for a pull request; upgrade/vault when ycash-dd has no such branch).
        if: steps.line.outputs.line == 'upgrade' && !cancelled()
        env:
          REF: ${{ github.base_ref || github.ref_name }}
        run: |
          url="https://github.com/$OTHER_LINE_REPO.git"
          other=upgrade/vault
          if git ls-remote --exit-code --heads "$url" "$REF" >/dev/null; then other=$REF; fi
          git fetch --no-tags --depth 1 "$url" "+refs/heads/$other:refs/remotes/other-line/head"
          echo "comparing with $OTHER_LINE_REPO $other @ $(git rev-parse --short other-line/head)"
          rc=0
          for f in src/test/data/vault_vectors.json src/test/data/yellowback_golden.json; do
            mine=$(sha256sum < "$f" | cut -c1-64)
            theirs=$(git show "other-line/head:$f" | sha256sum | cut -c1-64)
            if [ "$mine" = "$theirs" ]; then echo "identical: $f ($mine)"
            else echo "::error::$f differs from $OTHER_LINE_REPO $other (here $mine, there $theirs)"; rc=1; fi
          done
          exit $rc

      - name: RPC contract at rpcversion 5 (6 in term) through the workspace generator (findings (39), (44))
        # The upgrade line's doc/yellowback-rpc-contract.json must be exactly what the workspace's
        # scripts/extract_spec.py produces from this tree's doc/yellowback-rpc.md in its upgrade
        # mode (the doc is the whole contract there), at the workspace commit pinned in env.
        # Only the contract is compared: the spec copy also embeds plan text that moves with the
        # workspace (`make spec-check-upgrade` checks it there). On the in-term line the generator's
        # in-term mode applies the in-term plan's section 4.1 delta (rpcversion 6, `make spec-in-term`);
        # the pinned workspace commit must carry that mode.
        if: steps.line.outputs.line == 'upgrade' && !cancelled()
        env:
          INTERM: ${{ steps.line.outputs.interm }}
        run: |
          git init -q "$RUNNER_TEMP/ws"
          git -C "$RUNNER_TEMP/ws" fetch -q --depth 1 "https://github.com/$YB_WORKSPACE_REPO.git" "$YB_WORKSPACE_COMMIT"
          git -C "$RUNNER_TEMP/ws" checkout -q FETCH_HEAD
          EXTRACT_SPEC_NODE6_DIR="$GITHUB_WORKSPACE" WS="$RUNNER_TEMP/ws" python3 - <<'PY'
          import difflib, json, os, sys
          sys.path.insert(0, os.path.join(os.environ["WS"], "scripts"))
          import extract_spec as x
          doc = os.path.join(os.environ["GITHUB_WORKSPACE"], "doc", "yellowback-rpc.md")
          line, ver = ("interm", 6) if os.environ.get("INTERM") == "1" else ("upgrade", 5)
          if x.doc_line(doc) != line:
              sys.exit("doc/yellowback-rpc.md is rpcversion %s; the %s line is rpcversion %d" % (x.rpcdoc_version(doc), line, ver))
          want = x.contract_text(x.read_plan(), x.read_plan_v3(), doc, x.RPCDOC6_REL)
          have = open("doc/yellowback-rpc-contract.json", encoding="utf-8", newline="").read()
          if json.loads(have).get("rpcversion") != ver:
              sys.exit("contract rpcversion is not %d" % ver)
          if have != want:
              sys.stdout.writelines(difflib.unified_diff(have.splitlines(True), want.splitlines(True), "committed", "generated"))
              sys.exit("doc/yellowback-rpc-contract.json is not the generator's output: regenerate it (make spec%s in the workspace)" % ("-in-term" if line == "interm" else "-upgrade"))
          print("contract: rpcversion %d, identical to the generator's output (%d bytes)" % (ver, len(have)))
          PY

      - name: Determinism, no clock, no sockets, no bans (plan §3.10, §8.4 items 2 and 8)
        # The state machine and the pure modules may not read the clock, the mempool, the wallet
        # or configuration, and never use floating point. Comment lines are skipped (they may
        # name what is forbidden). tag.cpp joins the list when Phase 1 adds it (K23).
        run: |
          set -e
          # attest and bundle join the set in v3 (plan §3.10); they exist from Phase A0's crypto chunk.
          pure=""
          for f in state math tag payload script view attest bundle; do
            for x in src/yellowback/$f.cpp src/yellowback/$f.h; do test -f "$x" && pure="$pure $x"; done
          done
          echo "pure modules:$pure"
          ! grep -n "GetTime\|GetAdjustedTime\|mempool\|pwalletMain\|GetArg\|double\|float" $pure | grep -v ':[0-9]*:[[:space:]]*\(//\|\*\)' || exit 1
          # libsecp256k1 is reached through one wrapper only, VerifyCompactSig in attest.cpp (v3 §3.10,
          # §8.4 item 2), so the fuzz harness can stub it and low-S is enforced in one place. Comment
          # lines are skipped; nothing else under src/yellowback or src/rpc/yellowback* may name it.
          ! grep -n "secp256k1_" src/yellowback/*.cpp src/yellowback/*.h src/rpc/yellowback*.cpp 2>/dev/null | grep -v '^src/yellowback/attest\.cpp:' | grep -v ':[0-9]*:[[:space:]]*\(//\|\*\)' || exit 1
          # index.cpp may read the mempool (RemoveInvalidVaultSpends) but never the clock or floating point.
          ! grep -n "GetTime\|GetAdjustedTime\|double\|float" src/yellowback/index.cpp src/yellowback/index.h | grep -v ':[0-9]*:[[:space:]]*\(//\|\*\)' || exit 1
          # The clock has three homes: the quote RPC (stamps receivedAt), policy.cpp (BuildTagScript,
          # M11), and the wallet RPC's carrier wait (A3's two-step mint -- a user-facing deadline in
          # wallet-tier code, never a consensus input).  The patterns are anchored: an unescaped
          # 'rpc/yellowback.cpp' also matched nothing but itself, which is how the third home
          # surfaced as a failure rather than a decision.
          homes=$(grep -l "GetTime\|GetAdjustedTime" src/yellowback/*.cpp src/rpc/yellowback*.cpp 2>/dev/null | grep -vE 'yellowback/policy\.cpp$|rpc/yellowback\.cpp$|rpc/yellowbackwallet\.cpp$' || true)
          test -z "$homes" || { echo "GetTime outside its three homes: $homes"; exit 1; }
          # In that third home the only clock symbol is GetTimeMillis, and only for the wait timeout.
          ! grep -n "GetTime\|GetAdjustedTime" src/rpc/yellowbackwallet.cpp | grep -v "GetTimeMillis" || exit 1
          # Every yellowback script the runner knows must be executable (rpc-tests.py exec's it
          # directly) and must be run by some job: registered-but-never-run is how the v2
          # enforcement suite and then the whole v3 attestation suite sat silent in CI.
          # The allow-list names only the scripts a nightly step runs by name (audit I-1).
          for f in qa/rpc-tests/yellowback_*.py qa/rpc-tests/vault_*.py; do
            test -x "$f" || { echo "$f is registered but not executable; chmod +x it"; exit 1; }
            n=$(basename "$f" .py)
            grep -q "'$n\.py'" qa/pull-tester/rpc-tests.py || { echo "$n is not registered in qa/pull-tester/rpc-tests.py"; exit 1; }
            case " $YELLOWBACK_SCRIPTS $SANITIZER_SCRIPTS yellowback_attest_agent yellowback_devnet_roles yellowback_devnet_upgrade yellowback_stockparity yellowback_demo_v6 " in
              *" $n "*) ;;
              *) echo "$n is in qa/rpc-tests/ but no CI job runs it"; exit 1 ;;
            esac
          done
          # rpc-tests.py silently drops a named script it does not list (ALL_SCRIPTS filter), so every
          # name a job passes it must be registered there.
          # Either quote: ZMQ_SCRIPTS registers zmq_test with double quotes.
          for n in $YELLOWBACK_SCRIPTS $SANITIZER_SCRIPTS $STOCK_BASELINE yellowback_attest_agent yellowback_devnet_roles yellowback_devnet_upgrade yellowback_stockparity yellowback_demo_v6; do
            test -f "qa/rpc-tests/$n.py" || { echo "$n is in a CI list but qa/rpc-tests/$n.py does not exist"; exit 1; }
            grep -qE "[\"']$n\.py[\"']" qa/pull-tester/rpc-tests.py || { echo "$n is in a CI list but not in qa/pull-tester/rpc-tests.py"; exit 1; }
          done
          grep -qF "'$STOCK_BASELINE_MINEBLOCK'" qa/pull-tester/rpc-tests.py || { echo "$STOCK_BASELINE_MINEBLOCK is not in qa/pull-tester/rpc-tests.py"; exit 1; }
          # EDGES is the topology declaration (it names the v3 attestor slots 6-7); a six-node v2
          # script that iterates it raw indexes self.nodes out of range.  Walk live_edges() instead.
          ! grep -rn "in self\.EDGES" qa/rpc-tests/ | grep -v 'yellowback_util\.py:.*a < n and b < n' || exit 1
          # Never ban a peer for a Yellowback verdict (N1): DoS(0) only, ever, and never the other
          # ban entry point Misbehaving( (audit I-9). main.cpp's own inserted lines are checked
          # against the baseline diff in "v2 gates" below; the whole of stock main.cpp is full of
          # DoS(100) and must not be grepped here.
          # Every `! check` in these steps carries `|| exit 1`: bash -e ignores the status of a
          # command negated with `!`, so until 2026-10-01 only the last line of a step could fail.
          # That hid this grep's inclusion of src/main.cpp and the comment hit below (ci6).
          ! grep -n "DoS([1-9]\|Misbehaving(" src/yellowback/*.cpp src/rpc/yellowback*.cpp || exit 1
          # EvaluateBlock is total (K1): no throw, no assert in the state machine or the arithmetic.
          ! grep -n "throw\|assert(" src/yellowback/state.cpp src/yellowback/math.h || exit 1
          # The overlay adds no networking to the node (anchored: UndoDisconnect( must not match).
          ! grep -nE "evhttp|socket|\bconnect\(" src/yellowback/*.cpp src/yellowback/*.h src/rpc/yellowback*.cpp | grep -v ':[0-9]*:[[:space:]]*\(//\|\*\)' || exit 1
          # The transaction_builder extension is called only by the Yellowback builder and its tests (§8.4 item 22).
          ! git grep -n "AddTransparentInputUnsigned\|SetLockTime(" -- src ':!src/transaction_builder.h' ':!src/transaction_builder.cpp' ':!src/yellowback/' ':!src/test/yellowback_*' || exit 1

      - name: Documents (fork-local only, P4)
        # Staleness against the plan is a workspace check (make status -> spec-check), not a fork check.
        run: |
          set -e
          ! grep -q 'no consensus change' doc/yellowback.md || exit 1
          grep -q 'federation prototype, being replaced' doc/yellowback.md
          grep -q 'Build and test baseline' doc/yellowback.md
          # The published spec copy was not hand-edited: its header hash equals the hash of its body.
          test "$(sed -n 's/^Source: .*sha256: \([0-9a-f]*\).*/\1/p' doc/yellowback-spec.md)" = "$(sed '1,/^---$/d' doc/yellowback-spec.md | sha256sum | cut -c1-64)"
          # The trust statement in doc/yellowback.md is the spec's §8.1, byte for byte (leading and
          # trailing blank lines aside).
          section() { awk -v h="$1" '$0 ~ h {f=1; next} f && /^#/ {exit} f' "$2" | awk 'NF{p=1} p' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'; }
          diff <(section '^### 8\.1 ' doc/yellowback-spec.md) <(section '^## Trust statement' doc/yellowback.md)
          python3 -c 'import json; json.load(open("doc/yellowback-rpc-contract.json"))'
          # The vault RPC contract (finding (47)) is generated from doc/vault-rpc.md and agrees with the
          # RPC table in src/rpc/vault.cpp and the conversions in src/rpc/client.cpp.
          python3 qa/vault-rpc-contract.py --check

      - name: v2 gates (blocking from Phase 3)
        # Every yed_* the node registers is in the RPC contract (P7); the Phase 3 acceptance
        # checks; and the federation is gone from the module (the whole-directory roster grep, N26).
        run: |
          set -e
          registered=$(grep -oh '"yed_[a-z]*"' src/rpc/yellowback*.cpp | tr -d '"' | sort -u)
          missing=$(for c in $registered; do python3 -c "import json,sys; d=json.load(open('doc/yellowback-rpc-contract.json')); sys.exit(0 if '$c' in d else 1)" || echo "$c"; done)
          test -z "$missing" || { echo "registered but not in doc/yellowback-rpc-contract.json: $missing"; exit 1; }
          ! git grep -in roster -- src/yellowback || exit 1
          # rpcversion 6 on the in-term line (in-term claims plan IT-7), 5 on the upgrade line.
          want=5; if grep -q '"inTermClaims"' src/rpc/yellowback.cpp; then want=6; fi
          export want
          test -f doc/yellowback-rpc.md && grep -q "rpcversion $want" doc/yellowback-rpc.md
          # rpcversion 5 (the vault upgrade, upgrade plan §15.10): yed_getinfo carries the upgrade object
          # and none of the retired enforcement fields (suppressedBlocks, valveTripped, abandoned, ...).
          python3 -c 'import json,sys; d=json.load(open("doc/yellowback-rpc-contract.json")); r=d["yed_getinfo"]["returns"]; sys.exit(0 if "upgrade" in r and not set(r) & {"suppressedBlocks","rejectedBlocks","enforcing","valveTripped","sunset","abandoned","templatePolicy"} and "yed_sweep" not in d else 1)'
          # v3 contract (Phase A0; rpcversion 5 since the vault upgrade): the attest object on yed_getinfo,
          # every §4.5 command and error identifier present in the generated JSON — the C++ agents implement these names.
          python3 - <<'PY'
          import json, os, sys
          d = json.load(open("doc/yellowback-rpc-contract.json"))
          missing = []
          want = int(os.environ["want"])
          if d.get("rpcversion") != want: missing.append("rpcversion=%d" % want)
          if want == 6:   # in-term claims (in-term plan IT-7, IT-9; section 4.1)
              if d["yed_getinfo"]["returns"]["params"].get("inTermClaims") is not True: missing.append("yed_getinfo.params.inTermClaims")
              if "yed_estimateredeem" not in d: missing.append("yed_estimateredeem")
          if "attest" not in d["yed_getinfo"]["returns"]: missing.append("yed_getinfo.attest")
          for c in ["yed_listattestors", "yed_getattestations", "yed_addattestation", "yed_buildbundle", "yed_getselection",
                    "yed_getnotice", "yed_claimnotice", "yed_sweepcarriers", "yed_registerattestor", "yed_withdrawbond",
                    "yed_revive", "yed_reportequivocation", "yed_signattestation"]:
              if c not in d: missing.append(c)
          for e in ["attest-unknown-seq", "attest-not-eligible", "attest-stale", "attest-bad-sig", "attest-range",
                    "bundle-insufficient", "mint10-diverged", "notice-standing", "notice-not-underwater", "bond-below-min",
                    "lock-below-min", "bond-locked", "not-dormant", "not-equivocation", "attest-key-not-held",
                    "equivocation-guard"]:
              if e not in d["errors"]: missing.append("errors." + e)
          if missing: print("contract missing:", missing); sys.exit(1)
          PY
          # The spec copy is the vault upgrade's (make spec-upgrade: the upgrade plan's section 10 trust
          # statement as 8.1 and its section 15); the harden line's v3 delta is not in it.
          grep -q '^## Vault upgrade specification' doc/yellowback-spec.md
          test -f doc/yellowback-attestor.md && test -f qa/yellowback-frozen-files.txt
          # U-21: the vault primitive's consensus checks (its block verdict, its timelock and the
          # final-transaction check it extends) and the YED module's block verdict are consensus
          # rejections (DoS 100); every other inserted DoS stays DoS(0).
          git diff ycash6-baseline...HEAD -- src/main.cpp | grep '^+' | grep 'DoS(\|Misbehaving(' \
            | grep -v -e 'DoS(100, error("ConnectBlock(): vault: %s"' -e 'DoS(100, error("ConnectBlock(): %s", yb\.reason' \
                      -e '"bad-txns-vault-timelock")' -e '"bad-txns-nonfinal")' | { ! grep -v 'DoS(0'; } || exit 1
          # Every inserted main.cpp statement is inside `if (g_yellowback)` (§8.4 item 2): the residual is printed for the reviewer.
          echo "main.cpp residual (lines not mentioning g_yellowback):"
          git diff ycash6-baseline...HEAD -- src/main.cpp | grep '^+' | grep -v 'g_yellowback\|#include\|^+$\|^+++' || true

      - name: Rule -> test tags (blocking; v2 plan §7)
        # Independent check: runs even if an earlier step failed, so one red result
        # does not hide the others. The job still fails overall.
        if: ${{ !cancelled() }}
        # Every identifier of §3.2 and §3.7-3.9 must appear on a `// Rule:` / `# Rule:` line of a
        # unit case or a functional script. Blocking since 2026-10-01 (audit I-2): the step carried
        # continue-on-error from before Phase 6 long after Phase 6 was delivered. `-P`: `\b` is a
        # PCRE word boundary, not a POSIX ERE one.
        run: |
          set -e
          tagged=$(grep -ho '^\(//\|#\) Rule: .*' src/test/yellowback_*.cpp qa/rpc-tests/yellowback_*.py | sed 's/.*Rule: //' | tr ' ' '\n' | sort -u)
          echo "rules with a tagged test:"; echo "$tagged" | tr '\n' ' '; echo
          test -n "$tagged"
          rc=0
          # ACT-4 (participation), ACT-6 (the signal) and ACT-7 (the valve) left with the enforcement
          # machinery in the vault upgrade (upgrade plan §6): no test can carry them.
          for id in TAG-1 TAG-2 TAG-3 TAG-4 TAG-5 PRICE-1 PRICE-2 SIGMA-1 FEE-0 FEE-1 FEE-2 FEE-W REG-1 REG-2 REG-3 REG-4 IN-1 IN-2 IN-3 TX-0 \
                    MINT-1 MINT-2 MINT-3 MINT-4 MINT-5 MINT-6 MINT-7 MINT-8 XFER-1 XFER-2 XFER-3 RED-1 RED-2 RED-3 RED-4 \
                    ACT-1 ACT-2 ACT-3 ACT-5 HALT-1 HALT-2 HALT-3 HALT-4 BLK-1 BLK-2 BLK-3 TPL-1 TPL-2 TPL-3 \
                    MP-1 MINER-1 MINER-2 MINER-3 MINTPOL-1 SNAP UNDO; do
            git grep -qP "^(//|#) Rule: .*\b$id\b" -- src/test/yellowback_*.cpp qa/rpc-tests/yellowback_*.py || { echo "no test tagged: $id"; rc=1; }
          done
          exit $rc

      - name: Rule -> test tags, v3 identifiers (blocking since Phase A1, v3 plan §7)
        # The v3 rules of plan §3.8 (ARM-1/2, REG-A1, BUNDLE-1, MINT-9/10, NOT-1, EQV-1, REV-1, PIN-1/2,
        # AFEE-0/1, RED-5) landed with Phase A1 (yellowback_state_tests.cpp); every identifier must be
        # tagged. Fold the list into the loop above.
        if: ${{ !cancelled() }}
        run: |
          set -e
          rc=0
          for id in ARM-1 ARM-2 REG-A1 BUNDLE-1 MINT-9 MINT-10 NOT-1 EQV-1 REV-1 PIN-1 PIN-2 AFEE-0 AFEE-1 RED-5; do
            git grep -qP "^(//|#) Rule: .*\b$id\b" -- src/test/yellowback_*.cpp qa/rpc-tests/yellowback_*.py || { echo "no test tagged (v3): $id"; rc=1; }
          done
          exit $rc

  # The Rust attestor agent of v3 plan §5 (contrib/yellowback/attest/, Phase A4): built with the
  # toolchain its own rust-toolchain.toml pins, never by depends. Runs only when the crate exists —
  # a checkout without it (Phases A0-A3) skips every step and the job is green by construction.
  # GitHub's `paths:` filter is workflow-wide, not per job, so the gate is the presence check below
  # plus a cargo cache keyed on Cargo.lock; the crate is small and the job is cheap.
  agent:
    if: github.event_name != 'schedule' && contains(fromJSON('["push", "all"]'), inputs.tier || 'push')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Crate present?
        id: crate
        run: |
          if [ -f contrib/yellowback/attest/Cargo.toml ] && [ -f contrib/yellowback/attest/rust-toolchain.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"; echo "contrib/yellowback/attest/ not present yet (Phase A4); nothing to build"
          fi
      - name: Read the crate's toolchain pin (rust-toolchain.toml)
        # The pin lives in the crate, not in this workflow (v3 plan S8, W13); the SHA-pinned action
        # below installs exactly that channel (audit I-4: no `curl https://sh.rustup.rs | sh`).
        if: steps.crate.outputs.present == 'true'
        id: toolchain
        run: |
          chan=$(sed -n 's/^channel = "\(.*\)"/\1/p' contrib/yellowback/attest/rust-toolchain.toml)
          test -n "$chan"
          echo "channel=$chan" >> "$GITHUB_OUTPUT"
      - name: Install the pinned toolchain
        if: steps.crate.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1 (master, 2026-10-01)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.crate.outputs.present == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contrib/yellowback/attest/target
          key: attest-cargo-${{ runner.os }}-${{ hashFiles('contrib/yellowback/attest/Cargo.lock', 'contrib/yellowback/attest/rust-toolchain.toml') }}
      - name: cargo build --locked
        if: steps.crate.outputs.present == 'true'
        working-directory: contrib/yellowback/attest
        run: cargo build --locked
      - name: cargo test
        if: steps.crate.outputs.present == 'true' && !cancelled()
        working-directory: contrib/yellowback/attest
        run: cargo test --locked
      - name: cargo clippy -D warnings
        if: steps.crate.outputs.present == 'true' && !cancelled()
        working-directory: contrib/yellowback/attest
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: rustfmt
        if: steps.crate.outputs.present == 'true' && !cancelled()
        working-directory: contrib/yellowback/attest
        run: cargo fmt --check
      - name: cargo audit (RustSec advisories over Cargo.lock; audit I-7)
        # The agent is the one Yellowback component that opens outbound connections and holds a
        # signing key; its lock names ~390 crates. A known vulnerability fails the job; the
        # cargo-audit release is pinned (CARGO_AUDIT_VERSION) and installed --locked.
        if: steps.crate.outputs.present == 'true' && !cancelled()
        working-directory: contrib/yellowback/attest
        run: |
          cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
          cargo audit --version
          cargo audit --db "$RUNNER_TEMP/advisory-db"   # its own clone: a cached or cargo-deny-populated ~/.cargo/advisory-db is refused as non-empty
      - name: cargo deny (advisories, licences, bans, sources per deny.toml; audit D-12)
        # The crate's deny.toml (cargo-deny 0.18 syntax, as chain-viz's) is the policy; the
        # cargo-deny release is pinned (CARGO_DENY_VERSION) and installed --locked.
        if: steps.crate.outputs.present == 'true' && !cancelled()
        working-directory: contrib/yellowback/attest
        run: |
          cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
          cargo deny --version
          cargo deny --locked check
      - name: expected.json is the Python aggregator's answer
        if: steps.crate.outputs.present == 'true' && !cancelled()
        working-directory: contrib/yellowback/attest
        run: python3 fixtures/expected.py && git diff --exit-code fixtures/expected.json
      - name: The sample configuration parses
        if: steps.crate.outputs.present == 'true' && !cancelled()
        working-directory: contrib/yellowback/attest
        run: cargo run --locked -q -- check-config --conf attest.toml.sample
      - name: No agent crate in the node's build (v3 plan §8.4 item 14)
        if: steps.crate.outputs.present == 'true' && !cancelled()
        run: |
          ! grep -q 'iroh' Cargo.lock || exit 1
          ! ls depends/packages | grep -qi 'iroh\|yellowback-attest' || exit 1

  python:
    if: github.event_name != 'schedule' && contains(fromJSON('["push", "all"]'), inputs.tier || 'push')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/yellowback-prereqs
        with:
          apt: 'false'
      - name: Quote agent and price-feed unit tests (Phase 7)
        run: python3 -m unittest contrib/yellowback/test_yellowback_price.py contrib/yellowback/test_yellowback_quote.py
      - name: Calibration scripts' unit tests (v3 Phase A4; offline)
        if: ${{ !cancelled() }}
        run: python3 -m unittest contrib/yellowback/attest/calibrate/test_calibrate.py
      - name: pyflakes (functional tests and the shared helpers)
        # Independent check: runs even if an earlier step failed, so one red result
        # does not hide the others. The job still fails overall. The two v3 framework files
        # (Phase A0's pyfw chunk) are listed by name; a file that is not there yet is skipped, one
        # that is there is checked.
        if: ${{ !cancelled() }}
        run: |
          files="qa/rpc-tests/yellowback_*.py qa/rpc-tests/test_framework/yellowback_util.py"
          for f in qa/rpc-tests/test_framework/yellowback_attest.py qa/rpc-tests/test_framework/test_yellowback_attest.py; do
            test -f "$f" && files="$files $f"
          done
          python3 -m pyflakes $files
      - name: sign_attestation known-answer test and the attest framework's unit tests (v3 plan §6.0 item 6)
        # test_framework/test_yellowback_attest.py holds the low-S known-answer vectors (R18) that the
        # C++ yellowback_attest_tests replays; it imports the inherited framework, hence the same
        # prerequisites the main job installs. Skipped, loudly, until the pyfw chunk lands.
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f qa/rpc-tests/test_framework/test_yellowback_attest.py ]; then
            echo "qa/rpc-tests/test_framework/test_yellowback_attest.py not present yet (Phase A0 pyfw chunk)"; exit 0
          fi
          python3 -m pip install --user simplejson
          site=$(python3 -c 'import site; print(site.getusersitepackages())')
          mkdir -p "$site"
          printf '%s\n' '"""Shim: pyblake2 is unmaintained; Python 3.6+ has hashlib.blake2b with the same API."""' \
                        'from hashlib import blake2b, blake2s  # noqa: F401' > "$site/pyblake2.py"
          cd qa/rpc-tests && python3 -m unittest test_framework.test_yellowback_attest test_framework.test_yellowback_model test_framework.test_yellowback_util -v
      - name: vault framework unit tests and the vault_vectors.json check (upgrade plan §15.9)
        # test_framework/vault.py is the second implementation of the vault primitive; its unit
        # tests include gen_vault_vectors.py --check, so a stale golden vector fails here.
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip install --user simplejson
          site=$(python3 -c 'import site; print(site.getusersitepackages())')
          mkdir -p "$site"
          printf '%s\n' '"""Shim: pyblake2 is unmaintained; Python 3.6+ has hashlib.blake2b with the same API."""' \
                        'from hashlib import blake2b, blake2s  # noqa: F401' > "$site/pyblake2.py"
          python3 -m pyflakes qa/rpc-tests/test_framework/vault.py qa/rpc-tests/test_framework/test_vault.py qa/rpc-tests/test_framework/gen_vault_vectors.py qa/rpc-tests/test_framework/vault_harness.py qa/rpc-tests/vault_primitive.py qa/rpc-tests/vault_slashing.py qa/rpc-tests/vault_bridge.py
          python3 qa/rpc-tests/test_framework/gen_vault_vectors.py --check
          cd qa/rpc-tests && python3 -m unittest test_framework.test_vault -v
      - name: pyflakes (contrib; blocking from Phase 7)
        # Independent check: runs even if an earlier step failed, so one red result
        # does not hide the others. The job still fails overall.
        if: ${{ !cancelled() }}
        run: python3 -m pyflakes contrib/yellowback/*.py contrib/yellowback/yellowback-quote contrib/yellowback/pool/check-coinbase contrib/yellowback/devnet/yellowback-devnet contrib/yellowback/attest/calibrate/*.py
      - name: The quote agent's acceptance line (plan Phase 7)
        run: contrib/yellowback/yellowback-quote --conf contrib/yellowback/pool/yellowback-quote.toml.sample --dry-run --mock-price /dev/stdin <<< 0.05
      - name: Fuzz corpora and the embedded replay tables agree (N34)
        # Independent check: runs even if an earlier step failed, so one red result
        # does not hide the others. The job still fails overall.
        if: ${{ !cancelled() }}
        # Also checks that src/test/data/yellowback_golden.json is the qa/ model's copy (N18, N23).
        # The vault primitive's target (src/fuzzing/Vault) has its own generator once it is ported
        # (ycash-dd: gen_vault_corpus.py); checked the same way when present.
        run: |
          python3 src/test/gen_yellowback_corpus.py --check
          if [ -f src/test/gen_vault_corpus.py ]; then python3 src/test/gen_vault_corpus.py --check; fi
      - name: The attestation known-answer vectors regenerate byte for byte (BUNDLE-1, R13)
        # The generator has no --check mode: regenerate, then require a clean tree.
        if: ${{ !cancelled() }}
        run: |
          python3 src/test/gen_yellowback_attest_vectors.py
          git diff --exit-code -- src/test/data/yellowback_attest_vectors.json src/fuzzing/YellowbackBundle
          test -z "$(git status --porcelain -- src/fuzzing/YellowbackBundle)"

  # The attestor agent (plan §5, W13): its own toolchain (rust-toolchain.toml), its own lock,
  # never the node's depends/. Also proves fixtures/expected.json is still what the Python
  # aggregator (the reference) computes, so the Rust/Python cross-check cannot drift silently.
  nightly:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["nightly", "all"]'), inputs.tier)
    runs-on: ubuntu-22.04
    timeout-minutes: 600
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/yellowback-prereqs
      - uses: ./.github/actions/yellowback-depends
      - name: Build ycashd
        run: ./zcutil/build.sh -j"$(nproc)"
      - name: Check out the stock 6.20.0 tree (branch ycash6-stock)
        # Plan P-5: the reference node is ycash6-stock (= tag ycash6-baseline + baseline fix 3, the
        # regtest Equihash (48,5) chainparams lines), never the fork without -yellowback. It is
        # built from this checkout's depends tree and cargo target (no second depends build), so
        # its Cargo.lock must draw the same crates-io set: the --offline build reads crates-io from
        # the vendored directory `cargo vendor` filled for THIS branch's lock, and nothing is
        # re-vendored for the stock tree. Only the git dependencies ([patch.crates-io] zcash_*) may
        # differ, and those the two steps below fetch into the cargo home.
        id: stock
        run: |
          set -e
          git fetch --no-tags --depth 1 origin ycash6-stock
          stock="$RUNNER_TEMP/ycash6-stock"
          git worktree add --detach "$stock" FETCH_HEAD
          # The stock lock's blob id keys its cargo-home cache: hashFiles() reads the workspace only,
          # and the stock tree lives under RUNNER_TEMP.
          echo "lock=$(git rev-parse FETCH_HEAD:Cargo.lock)" >> "$GITHUB_OUTPUT"
          crates() { awk '/^name = /{n=$3} /^version = /{v=$3} /^source = / && $3 ~ /crates\.io/ {print n, v}' "$1" | sort; }
          if ! diff <(crates "$stock/Cargo.lock") <(crates Cargo.lock); then
            echo "ycash6-stock's crates-io set differs from this branch's: the vendored directory would not serve its --offline build"
            exit 1
          fi
          echo "stock Cargo.lock $(git rev-parse --short FETCH_HEAD:Cargo.lock): same crates-io set as $(git rev-parse --short HEAD:Cargo.lock); git dependencies:"
          git show FETCH_HEAD:Cargo.lock | sed -n 's/^source = "\(git+[^#]*\)#.*/\1/p' | sort -u
      - name: Cache the stock tree's cargo home (its git dependencies)
        # The depends action keys ~/.cargo/git on THIS branch's Cargo.lock, whose [patch.crates-io]
        # zcash_* crates pin this line's librustzcash rev (boyfromcave/librustzcash6 on the upgrade
        # line); the stock lock pins miodragpop/librustzcash ec525fae, and an --offline build of
        # the stock tree needs that checkout in the cargo home as well. Without it the first
        # upgrade-line nightly (2026-10-07) died at `cargo build --offline`: "failed to load source
        # for dependency f4jumble ... can't checkout ... you are in the offline mode". Same path as
        # the depends action's entry: a restore merges into what is there, a save carries both.
        id: stock-cargo-home
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/git
          key: cargo-home-stock-${{ runner.os }}-${{ steps.stock.outputs.lock }}
      - name: Fetch the stock tree's git dependencies into the cargo home
        # depends' own cargo and rustc (never the runner's rustup), run FROM the stock tree so no
        # .cargo/config.toml of this checkout (the offline one build.sh wrote) applies. On the
        # hardening line the stock and fork locks pin the same rev, and this is a no-op.
        if: steps.stock-cargo-home.outputs.cache-hit != 'true'
        run: |
          native="$PWD/depends/x86_64-pc-linux-gnu/native/bin"
          test -x "$native/cargo" || { echo "no depends cargo at $native (depends not built)"; exit 1; }
          (cd "$RUNNER_TEMP/ycash6-stock" && RUSTC="$native/rustc" "$native/cargo" fetch --locked --manifest-path Cargo.toml)
          ls ~/.cargo/git/checkouts
      - name: Build the stock 6.20.0 binary for the stock-parity scripts
        # The worktree links this checkout's built triple and shares its cargo target (cargo
        # fingerprints every unit, so the stock's own librustzcash rev is built beside the fork's),
        # as the workspace's wt/ worktrees do. Exported as STOCK_YCASHD, NOT REF_YCASHD: the
        # framework hands REF_YCASHD to node 1 of every standard-topology script, so it is set per
        # step below.
        run: |
          set -e
          stock="$RUNNER_TEMP/ycash6-stock"
          ln -s "$PWD/depends/x86_64-pc-linux-gnu" "$stock/depends/x86_64-pc-linux-gnu"
          # src/Makefile.am links librustzcash.a from $(top_builddir)/target, whatever CARGO_TARGET_DIR
          # says, so the stock tree needs the shared target linked in as well (the local wt/ recipe
          # does both; the first nightly, 7702d2260, failed at CXXLD ycashd without it).
          ln -s "$PWD/target" "$stock/target"
          export CARGO_TARGET_DIR="$PWD/target"
          (cd "$stock" && ./autogen.sh && CONFIG_SITE="$stock/depends/x86_64-pc-linux-gnu/share/config.site" ./configure --quiet)
          qa/yellowback-cxxbridge-headers.sh "$stock" -j$(nproc)
          make -C "$stock/src" -j$(nproc) ycashd
          "$stock/src/ycashd" --version | head -1
          echo "STOCK_YCASHD=$stock/src/ycashd" >> "$GITHUB_ENV"
      - name: Stock parity and the stock node against the real stock binary
        # yellowback_stockparity: a ycash6-stock node and this fork without -yellowback are
        # byte-identical over 300 blocks, transactions and a reorg (plan section 4 item, F-24).
        # yellowback_stock_node: node 1 is the stock binary (the main job runs it fork-vs-fork).
        # Both scripts run the stock binary below the vault upgrade only, then swap it for the fork
        # binary (finding 37: a stock 6.20.0 binary refuses -nuparams=6d5b7a31).
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
          REF_YCASHD: ${{ env.STOCK_YCASHD }}
        run: |
          mkdir -p "$TMPDIR"
          test -x "$REF_YCASHD" || { echo "the ycash6-stock binary was not built; the scripts would fall back to fork-vs-fork"; exit 1; }
          qa/pull-tester/rpc-tests.py -j2 --nozmq --nocleanup yellowback_stockparity yellowback_stock_node
      - name: Full make check (minus the pin's broken ycash-tx vectors)
        # `make check` is check-TESTS (test_bitcoin and ycash-gtest, every suite) then check-local:
        # test/bitcoin-util-test.py, secp256k1 check, univalue check. The util script cannot pass
        # at the v4.5.0 pin: its inherited vectors execute ./zcash-tx (Ycash builds ycash-tx) and,
        # with that name linked, ten cases still expect Zcash t1... addresses where Ycash prints
        # s1... (chainparams.cpp PUBKEY_ADDRESS 0x1C,0x28). Both files are frozen at the pin, so
        # the step runs the other three parts by hand. Recorded in doc/yellowback.md (baseline).
        run: |
          make -C src check-TESTS
          make -C src/secp256k1 check
          make -C src/univalue check
      - name: Inherited functional tests recorded as passing at the 6.20.0 pin
        # Independent check: runs even if an earlier step failed, so one red result
        # does not hide the others. The job still fails overall.
        if: ${{ !cancelled() }}
        # The list is STOCK_BASELINE above, recorded by name in doc/yellowback-baseline.md
        # "Inherited functional suite at the pin" (no --nozmq: the list names zmq_test).
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
        run: |
          mkdir -p "$TMPDIR"
          qa/pull-tester/rpc-tests.py -j4 --nocleanup $STOCK_BASELINE "$STOCK_BASELINE_MINEBLOCK"
      # ycash6 port: yellowback_reorg_stress.py is retired (plan P-7). History: it was still the v1
      # federation script (rosters, anchors, cosigned price transactions) and dies at its first
      # yed_getinfo field. Its v2 adaptation is the unchecked item of the v2 plan's Phase 6
      # checklist; reorgs themselves are exercised by index, lifecycle, enforcement, mining,
      # void_mint, activation, stock_node and the three attest scripts. Removed 2026-09-23 (F-30).
      - name: Read the agent crate's toolchain pin (rust-toolchain.toml)
        if: ${{ !cancelled() }}
        id: toolchain
        run: |
          chan=$(sed -n 's/^channel = "\(.*\)"/\1/p' contrib/yellowback/attest/rust-toolchain.toml)
          test -n "$chan"
          echo "channel=$chan" >> "$GITHUB_OUTPUT"
      - name: Install the agent's pinned toolchain
        if: ${{ !cancelled() }}
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1 (master, 2026-10-01)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Build the attestor agent for the agent script
        # The only functional script that runs the shipped Rust binary (v3 plan Phase A4). It
        # SKIPs when the binary is missing, so a crate build failure must fail here, loudly,
        # rather than turning the next step into a silent pass. --locked as the agent job (audit I-6).
        if: ${{ !cancelled() }}
        working-directory: contrib/yellowback/attest
        run: |
          cargo build --release --locked
          echo "YELLOWBACK_ATTEST_BIN=$PWD/target/release/yellowback-attest" >> "$GITHUB_ENV"
      - name: Attestor agent end to end (extended)
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
        run: |
          mkdir -p "$TMPDIR"
          test -x "$YELLOWBACK_ATTEST_BIN" || { echo "the agent binary was not built; the script would SKIP"; exit 1; }
          qa/pull-tester/rpc-tests.py -j1 --nozmq --nocleanup yellowback_attest_agent
      - name: Devnet role presets end to end (extended)
        # The role-based regtest plan's regression suite (R7): brings up each preset through the
        # devnet script itself -- heartbeat, price walk, six personas, a shock, a liquidation --
        # and asserts the seat is empty and the world moved. Same binary as the step above.
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
        run: |
          mkdir -p "$TMPDIR"
          test -x "$YELLOWBACK_ATTEST_BIN" || { echo "the agent binary was not built; the script would SKIP"; exit 1; }
          qa/pull-tester/rpc-tests.py -j1 --nozmq --nocleanup yellowback_devnet_roles
      - name: Devnet on the vault upgrade end to end (extended)
        # upgrade-walk's core through the devnet script (upgrade plan §4, §5, §15.10): attestor set
        # membership and S15 dormancy, mint on the V template, transfer, redeem and renew, a claim
        # with a reorg across it, an attestor's cancel, an invalid mint and block, and the WYEC
        # bridge persona in both shapes. Same binary as the steps above.
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
        run: |
          mkdir -p "$TMPDIR"
          test -x "$YELLOWBACK_ATTEST_BIN" || { echo "the agent binary was not built; the script would SKIP"; exit 1; }
          qa/pull-tester/rpc-tests.py -j1 --nozmq --nocleanup yellowback_devnet_upgrade
      - name: The plan section 4 demonstration (extended)
        # ycash6 plan section 4 / Phase 6: the checklist walked on one eight-node chain with a transcript
        # line per item (yellowback_demo_v6.py, ~10 minutes). Node 1 is the ycash6-stock build from
        # the step above (REF_YCASHD) below the vault upgrade only -- a stock binary refuses the
        # vault -nuparams and cannot follow the chain past it (finding 37) -- so the script's item 0
        # is the fork-vs-stock parity check and node 1 is the fork binary for items 1-10.
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
          REF_YCASHD: ${{ env.STOCK_YCASHD }}
        run: |
          mkdir -p "$TMPDIR"
          test -x "$REF_YCASHD" || { echo "the ycash6-stock binary was not built; node 1 would be the fork binary"; exit 1; }
          qa/pull-tester/rpc-tests.py -j1 --nozmq --nocleanup yellowback_demo_v6
      - name: lightwalletd against the devnet (lightwalletd plan §6.3, Phase L2)
        # The light-client server's regtest suite: this fork's ycashd under a five-node devnet,
        # lightwalletd-dd (its feature branch) and the lightwalletd-legacy baseline both served
        # from node 0, then `go test -tags devnet` — the GetBlockRange byte-equality gate, the
        # YED views vs the wallet's, a mint built from raw parts through the server. Unverified
        # until the next scheduled run (the F-32 precedent); the driver is the same one a laptop runs.
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
        run: |
          # The fork at a commit, not a branch name, and the Go tarball against its published
          # sha256 (audit E-6): both pins are in env at the top of this file.
          git clone --quiet https://github.com/$LWD_REPO.git "$RUNNER_TEMP/lightwalletd-dd"
          git -C "$RUNNER_TEMP/lightwalletd-dd" checkout --quiet "$LWD_COMMIT"
          git -C "$RUNNER_TEMP/lightwalletd-dd" branch --quiet --track lightwalletd-legacy origin/lightwalletd-legacy
          curl -sSL -o "$RUNNER_TEMP/go.tar.gz" "https://go.dev/dl/go$GO_VERSION.linux-amd64.tar.gz"
          echo "$GO_SHA256  $RUNNER_TEMP/go.tar.gz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/go.tar.gz"
          export PATH="$RUNNER_TEMP/go/bin:$PATH"
          YCASH_DD="$PWD" YELLOWBACK_LWD_REPO="$RUNNER_TEMP/lightwalletd-dd" LWD_PYTHON="$(command -v python3)" LWD_DEVNET_DIR="$RUNNER_TEMP/yb-devnet-lwd" \
            "$RUNNER_TEMP/lightwalletd-dd/scripts/devnet-test.sh" --up --down --dir "$RUNNER_TEMP/yb-devnet-lwd" --portseed 8
      # Not yet here (§6.0 item 6): the STOCK_BASELINE a second time with
      # ZCASHD=qa/yellowback-wrapped-ycashd.sh; yellowback_enforcement.py --extended and
      # yellowback_runbook.py; yellowback_enforcement.py with REF_YCASHD (the stock adversary).
      - name: Fuzz smoke (N34)
        # Independent check: runs even if an earlier step failed, so one red result
        # does not hide the others. The job still fails overall.
        if: ${{ !cancelled() }}
        # Ycash's harness builds one target at a time: --enable-fuzz-main replaces main() and the
        # target's fuzz.cpp is linked as src/fuzz.cpp (plan §6.0 item 0). Each Yellowback target
        # runs 10 minutes from its corpus; findings land in <Target>/output and are uploaded, and
        # every file copied into <Target>/crashes/ is replayed by yellowback_fuzz_tests forever.
        run: |
          set -e
          sudo apt-get install -y clang
          # -fsanitize=fuzzer links libFuzzer's main(), so configure's own "C++ compiler works"
          # program (int main) fails to link with it in CXXFLAGS ("cannot create executables").
          # Instrument with fuzzer-no-link at configure time and add the runtime on the ycashd
          # link alone, the way Bitcoin Core's --with-sanitizers=fuzzer does.
          # config.site sets CC/CXX after the command line (autoconf restores nothing), so every
          # variant builds with depends' clang (22 at 6.20.0) targeting x86_64-pc-linux-gnu, while the LLVM
          # tarball keeps its compiler-rt runtimes (asan, ubsan, profile, fuzzer) under the
          # x86_64-unknown-linux-gnu per-target directory -- the mismatch native_clang.mk already
          # works around for libc++'s __config_site. Without the link the runtime archives are not
          # found and every -fsanitize/--coverage link test fails.
          rt=$(ls -d depends/x86_64-pc-linux-gnu/native/lib/clang/*/lib | head -1)
          ls "$rt"; test -e "$rt/x86_64-pc-linux-gnu" || ln -s x86_64-unknown-linux-gnu "$rt/x86_64-pc-linux-gnu"
          depends/x86_64-pc-linux-gnu/native/bin/clang -target x86_64-pc-linux-gnu -print-file-name=libclang_rt.asan.a
          # The steps above already built a normal ycashd. configure only adds -DZCASH_FUZZ to
          # the flags; make will not rebuild bitcoind.o, so src/ycashd stays the real binary and
          # exits asking for ycash.conf. Drop those objects before the fuzz configure.
          # -DFUZZ_WITH_LIBFUZZER compiles LLVMFuzzerTestOneInput (zcutil/libfuzzer/zcash-wrapper
          # does the same). Without it, fuzz.cpp contributes no entry point.
          make -C src clean
          # --disable-werror: 6.20.0's configure defaults --enable-werror to yes (v4.5.0: no), and under
          # ZCASH_FUZZ bitcoind.cpp's own '#warning BUILDING A FUZZER' is then an error (-W#warnings).
          CONFIG_SITE="$PWD/depends/x86_64-pc-linux-gnu/share/config.site" ./configure --enable-fuzz-main --disable-werror \
            CXXFLAGS='-fsanitize=fuzzer-no-link,address -DFUZZ_WITH_LIBFUZZER=1' LDFLAGS='-fsanitize=address' \
            || { grep -n -A30 'compiler works\|linker accepts -fsanitize\|accepts --coverage\|accepts -Wl,-z,relro' config.log | tail -160; exit 1; }
          # Every Yellowback* and Vault* target that has a fuzz.cpp (the vault primitive's target joins
          # when it is ported; ycash-dd has src/fuzzing/Vault), so a new target needs no edit here.
          targets=$(cd src/fuzzing && for d in Yellowback* Vault*; do [ -f "$d/fuzz.cpp" ] && echo "$d"; done; true)  # `; true`: the last glob may match nothing, and bash -e would end the step on that status
          echo "fuzz targets:" $targets
          for t in $targets; do
            # bitcoind.cpp includes fuzz.cpp. Retargeting the symlink does not change the mtime
            # make follows, so each target has to rebuild bitcoind.o or every run fuzzes the first.
            ln -sfn fuzzing/$t/fuzz.cpp src/fuzz.cpp
            # ycashd is libtool-linked: the make inputs are bitcoind.o and, when libtool
            # compiles, bitcoind.lo. The binary may be src/ycashd or src/.libs/ycashd.
            # GNU make stats the symlink target, so a new fuzz.cpp that is older than the
            # object is not a reason to rebuild. Remove every product of this one file.
            # The object is src/ycashd-bitcoind.o (ycashd_CPPFLAGS gives it a per-program name); before
            # 2026-09-30 this line missed it, so every target after the first re-linked the first one.
            rm -f src/ycashd-bitcoind.o src/bitcoind.o src/bitcoind.lo src/.libs/bitcoind.o src/ycashd src/.libs/ycashd
            # Overriding ycashd_LDFLAGS also drops 6.20.0's Linux '--whole-archive -ljemalloc' (src/Makefile.am),
            # which is wanted: a jemalloc malloc would shadow ASan's allocator.
            make -C src -j$(nproc) ycashd ycashd_LDFLAGS='$(RELDFLAGS) $(AM_LDFLAGS) $(LIBTOOL_APP_LDFLAGS) -fsanitize=fuzzer,address'
            mkdir -p src/fuzzing/$t/output
            ASAN_OPTIONS=detect_leaks=0 src/ycashd src/fuzzing/$t/output src/fuzzing/$t/input -max_len=4096 -max_total_time=600
          done
      - name: Upload fuzz findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yellowback-fuzz-findings
          path: |
            src/fuzzing/Yellowback*/output/crash-*
            src/fuzzing/Vault*/output/crash-*
          if-no-files-found: ignore
      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yellowback-nightly-logs
          path: ${{ runner.temp }}/yellowback-tests/**/node*/regtest/debug.log
          if-no-files-found: ignore
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "nightly failed: run $GITHUB_RUN_ID" \
            --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

  # The three variant builds of §6.0 item 6 (P6): a DEBUG_LOCKORDER build over the functional
  # suite, the sanitizers over the unit suites and three scripts, and lcov with the per-file
  # floors of qa/yellowback-coverage-floor.sh. Nightly; never block; open an issue on failure.
  lockorder:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["nightly", "all"]'), inputs.tier)
    runs-on: ubuntu-22.04
    timeout-minutes: 600
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/yellowback-prereqs
      - uses: ./.github/actions/yellowback-depends
      - name: Build with --enable-debug (defines DEBUG_LOCKORDER, configure.ac:244)
        # 6.20.0 has no DEBUG_LOCKORDER_LOGONLY switch and sync.cpp stays at zero delta (mapping §19 S3).
        # Stock 6.20.0 aborts on the first block relay between two peers (cs_vNodes vs the
        # pnode->cs_vRecvMsg TRY_LOCK, net.cpp; g_debug_lockorder_abort defaults to true and ycashd
        # cannot clear it, and clearing it only turns the abort into a std::logic_error out of LOCK),
        # and every debug node with a peer then corrupts its heap at exit (the lock bookkeeping is
        # destroyed before CNetCleanup takes LOCK(cs_hSocket)). qa/yellowback-lockorder-logonly.sh
        # patches the CI checkout's sync.cpp, never the repository: log-only reports and never-destroyed
        # bookkeeping; it fails if the four stock lines it rewrites have moved. The step after the
        # suite then fails on any report that names Yellowback.
        run: |
          qa/yellowback-lockorder-logonly.sh .
          ./autogen.sh
          # --disable-werror: 6.20.0 defaults --enable-werror to yes (v4.5.0: no); this variant
          # judges lock order at run time, the main job keeps -Werror on the release flags.
          CONFIG_SITE="$PWD/depends/x86_64-pc-linux-gnu/share/config.site" ./configure --enable-debug --disable-werror
          # A target-only make on a fresh tree needs the generated cxx bridge headers first.
          qa/yellowback-cxxbridge-headers.sh . -j$(nproc)
          make -C src -j$(nproc) ycashd ycash-cli test/test_bitcoin
      - name: Yellowback unit tests under DEBUG_LOCKORDER (AssertLockHeld aborts)
        run: src/test/test_bitcoin --run_test='yellowback_*,vault_*'
      - name: Functional suite under DEBUG_LOCKORDER (log-only; the next step judges the reports)
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
        # yellowback_stratum and yellowback_chainviz need the yolo / chain-viz binaries only the
        # main job builds; here they would SKIP (exit 0) and count as passes (audit I-3), so they
        # are left out, by name, with a line in the log.
        run: |
          mkdir -p "$TMPDIR"
          variant=""
          for n in $YELLOWBACK_SCRIPTS; do
            case "$n" in
              yellowback_stratum|yellowback_chainviz) echo "not run in this variant: $n (needs the sidecar binary the main job builds)" ;;
              *) variant="$variant $n" ;;
            esac
          done
          qa/pull-tester/rpc-tests.py -j2 --nocleanup $variant $STOCK_BASELINE "$STOCK_BASELINE_MINEBLOCK"
      - name: No potential deadlock involving Yellowback in any debug.log
        if: always()
        # qa/yellowback-lockorder-check.py groups every report; the inherited net.cpp TRY_LOCK pairs
        # are counted, the provably-benign cs_yellowback/ControlMutex pair (both under cs_main;
        # F-37) is allow-listed with its proof in the script, anything else naming Yellowback fails.
        run: qa/yellowback-lockorder-check.py "${{ runner.temp }}/yellowback-tests"
      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yellowback-lockorder-logs
          path: ${{ runner.temp }}/yellowback-tests/**/node*/regtest/debug.log
          if-no-files-found: ignore
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "lockorder failed: run $GITHUB_RUN_ID" \
            --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

  sanitizers:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["nightly", "all"]'), inputs.tier)
    runs-on: ubuntu-22.04
    timeout-minutes: 600
    permissions:
      contents: read
      issues: write
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/yellowback-prereqs
        with:
          apt-extra: clang
      - uses: ./.github/actions/yellowback-depends
      - name: Sanitizer-friendly ASLR
        # The runner kernels' vm.mmap_rnd_bits=32 breaks the ASan/TSan shadow mapping of older
        # compiler-rt ("unexpected memory mapping"); LLVM 18+ re-execs around it, 28 makes it moot.
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: address + undefined (configure.ac:211)
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
        run: |
          mkdir -p "$TMPDIR"     # before configure: config.guess needs TMPDIR to exist ("cannot guess build type")
          ./autogen.sh
          # config.site sets CC/CXX after the command line (autoconf restores nothing), so every
          # variant builds with depends' clang (22 at 6.20.0) targeting x86_64-pc-linux-gnu, while the LLVM
          # tarball keeps its compiler-rt runtimes (asan, ubsan, profile, fuzzer) under the
          # x86_64-unknown-linux-gnu per-target directory -- the mismatch native_clang.mk already
          # works around for libc++'s __config_site. Without the link the runtime archives are not
          # found and every -fsanitize/--coverage link test fails.
          rt=$(ls -d depends/x86_64-pc-linux-gnu/native/lib/clang/*/lib | head -1)
          ls "$rt"; test -e "$rt/x86_64-pc-linux-gnu" || ln -s x86_64-unknown-linux-gnu "$rt/x86_64-pc-linux-gnu"
          depends/x86_64-pc-linux-gnu/native/bin/clang -target x86_64-pc-linux-gnu -print-file-name=libclang_rt.asan.a
          # --with-sanitizers=address appends -static-libasan and configure.ac (configure.ac:293,
          # frozen) aborts when the probe fails: depends' clang rejects that GCC flag ("unknown
          # argument '-static-libasan'"); compiler-rt's asan archive is already static. So the
          # flags go in by hand. --disable-werror: 6.20.0 defaults --enable-werror to yes (v4.5.0:
          # no); this variant judges run-time reports, the main job keeps -Werror.
          CONFIG_SITE="$PWD/depends/x86_64-pc-linux-gnu/share/config.site" ./configure --disable-werror \
            CXXFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            LDFLAGS='-fsanitize=address,undefined' \
            || { grep -n -A30 'compiler works\|linker accepts -fsanitize\|accepts --coverage\|accepts -Wl,-z,relro' config.log | tail -160; exit 1; }
          qa/yellowback-cxxbridge-headers.sh . -j$(nproc)
          # ycashd_LDFLAGS is overridden, as in the fuzz jobs, to drop 6.20.0's Linux-only
          # '-Wl,--whole-archive -ljemalloc' (src/Makefile.am, `if TARGET_LINUX`): a whole-archive
          # jemalloc defines malloc/free in the executable and pre-empts ASan's interceptors, so
          # heap errors go unseen, the allocators mix, or the link fails on a duplicate malloc.
          # -lpthread -ldl went with it; glibc 2.34+ carries both in libc. test_bitcoin and
          # ycash-cli never linked jemalloc.
          make -C src -j$(nproc) ycashd ycash-cli test/test_bitcoin ycashd_LDFLAGS='$(RELDFLAGS) $(AM_LDFLAGS) $(LIBTOOL_APP_LDFLAGS)'
          # Prove it: jemalloc's internals carry its private namespace (jemalloc.mk:
          # --with-private-namespace=ycash_je_). The binary may sit under .libs (libtool).
          bin=src/.libs/ycashd; test -f "$bin" || bin=src/ycashd
          nm "$bin" | grep -c . >/dev/null
          ! nm "$bin" | grep -q 'ycash_je_' || exit 1
          src/test/test_bitcoin --run_test='yellowback_*,vault_*'
          qa/pull-tester/rpc-tests.py -j2 --nozmq --nocleanup $SANITIZER_SCRIPTS
      - name: thread
        run: |
          make -C src clean
          CONFIG_SITE="$PWD/depends/x86_64-pc-linux-gnu/share/config.site" ./configure --with-sanitizers=thread --disable-werror \
            || { grep -n -A30 'compiler works\|linker accepts -fsanitize\|accepts --coverage\|accepts -Wl,-z,relro' config.log | tail -160; exit 1; }
          make -C src -j$(nproc) test/test_bitcoin
          # Rust's rayon pool is uninstrumented; qa/yellowback-tsan-suppressions.txt says why and
          # lists only its crates (first scheduled run on 7702d2260: 2 reports, both in rayon).
          TSAN_OPTIONS="suppressions=$PWD/qa/yellowback-tsan-suppressions.txt" \
            src/test/test_bitcoin --run_test='yellowback_*,miner_tests,mempool_tests'
      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yellowback-sanitizer-logs
          path: ${{ runner.temp }}/yellowback-tests/**/node*/regtest/debug.log
          if-no-files-found: ignore
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "sanitizers failed: run $GITHUB_RUN_ID" \
            --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

  coverage:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["nightly", "all"]'), inputs.tier)
    runs-on: ubuntu-22.04
    timeout-minutes: 600
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/yellowback-prereqs
        with:
          apt-extra: lcov
      - uses: ./.github/actions/yellowback-depends
      - name: Build with --enable-lcov (configure.ac:167), unit and functional suites against the instrumented ycashd
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
        run: |
          mkdir -p "$TMPDIR"     # before configure: config.guess needs TMPDIR to exist ("cannot guess build type")
          ./autogen.sh
          # config.site sets CC/CXX after the command line (autoconf restores nothing), so every
          # variant builds with depends' clang (22 at 6.20.0) targeting x86_64-pc-linux-gnu, while the LLVM
          # tarball keeps its compiler-rt runtimes (asan, ubsan, profile, fuzzer) under the
          # x86_64-unknown-linux-gnu per-target directory -- the mismatch native_clang.mk already
          # works around for libc++'s __config_site. Without the link the runtime archives are not
          # found and every -fsanitize/--coverage link test fails.
          rt=$(ls -d depends/x86_64-pc-linux-gnu/native/lib/clang/*/lib | head -1)
          ls "$rt"; test -e "$rt/x86_64-pc-linux-gnu" || ln -s x86_64-unknown-linux-gnu "$rt/x86_64-pc-linux-gnu"
          depends/x86_64-pc-linux-gnu/native/bin/clang -target x86_64-pc-linux-gnu -print-file-name=libclang_rt.asan.a
          # --disable-werror: 6.20.0 defaults --enable-werror to yes (v4.5.0: no); -O0 --coverage
          # builds are not where warnings are judged (the main job keeps -Werror).
          CONFIG_SITE="$PWD/depends/x86_64-pc-linux-gnu/share/config.site" ./configure --enable-lcov --disable-werror \
            || { grep -n -A30 'compiler works\|linker accepts -fsanitize\|accepts --coverage\|accepts -Wl,-z,relro' config.log | tail -160; exit 1; }
          qa/yellowback-cxxbridge-headers.sh . -j$(nproc)
          make -C src -j$(nproc) ycashd ycash-cli test/test_bitcoin
          make check || true
          src/test/test_bitcoin
          mkdir -p "$TMPDIR"
          # As the lockorder job: the two sidecar scripts would SKIP here (audit I-3).
          variant=""
          for n in $YELLOWBACK_SCRIPTS; do
            case "$n" in
              yellowback_stratum|yellowback_chainviz) echo "not run in this variant: $n (needs the sidecar binary the main job builds)" ;;
              *) variant="$variant $n" ;;
            esac
          done
          qa/pull-tester/rpc-tests.py -j2 --nozmq --nocleanup $variant
      - name: lcov over src/yellowback and src/rpc/yellowback*, the floors of qa/yellowback-coverage-floor.sh
        run: |
          set -e
          # --enable-lcov compiles with depends' clang (22.1.7 at 6.20.0; 18.1.8 with LEGACY_GLIBC=1),
          # whose .gcno notes the runner's GCC 11.4 gcov refuses ("GCOV failed"). native_clang.mk
          # does not stage llvm-cov; it is in the cached LLVM tarball, and the staged native lib/
          # satisfies its $ORIGIN/../lib lookup. 6.20.0 renamed the default tarball
          # LLVM-<v>-Linux-X64.tar.xz; the v4.5.0 name survives only under LEGACY_GLIBC=1.
          # That llvm-cov needs glibc 2.34 to run (native_clang.mk), which ubuntu-22.04 (2.35) has,
          # and apt's lcov there is 1.15, whose --gcov-tool and lcov_branch_coverage rc this uses
          # (lcov 2.x on 24.04 would also need --ignore-errors for clang's gcov output).
          lcov --version
          tar=$(ls depends/sources/LLVM-*-Linux-X64.tar.xz depends/sources/clang-llvm-*-x86_64-linux-gnu-ubuntu-18.04.tar.xz 2>/dev/null | head -1)
          test -n "$tar"
          inner=$(tar -tJf "$tar" | awk '/\/bin\/llvm-cov$/{print; exit}')
          test -n "$inner"
          tar -xJf "$tar" -C "$RUNNER_TEMP" "$inner"
          cov="$RUNNER_TEMP/$inner"
          chmod +x "$cov"
          native="$PWD/depends/x86_64-pc-linux-gnu/native/lib"
          wrapper="$RUNNER_TEMP/llvm-gcov"
          printf '%s\n' '#!/bin/sh' \
            "export LD_LIBRARY_PATH=$(printf '%q' "$native")\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}" \
            "exec $(printf '%q' "$cov") gcov \"\$@\"" > "$wrapper"
          chmod +x "$wrapper"
          "$wrapper" --version
          lcov --capture --directory src --gcov-tool "$wrapper" --output-file lcov-all.info --rc lcov_branch_coverage=0
          lcov --extract lcov-all.info '*/src/yellowback/*' '*/src/rpc/yellowback*' --output-file lcov.info
          lcov --list lcov.info
          genhtml lcov.info --output-directory coverage-html
          qa/yellowback-coverage-floor.sh lcov.info
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yellowback-coverage
          path: |
            lcov.info
            coverage-html
          if-no-files-found: ignore
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "coverage failed: run $GITHUB_RUN_ID" \
            --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

  weekly-fuzz:
    # Thirty minutes per Yellowback target with corpus minimisation, then a PR with the new corpus
    # files and the regenerated C++ replay table (plan §6.0 item 6, §7 "Fuzzing"). Never blocks.
    # It was two hours per target until 2026-09-28: six of those are twelve hours in one job, and
    # GitHub-hosted runners cancel every job at six hours whatever timeout-minutes says, so the
    # first run (36377015194) died in the third target with nothing committed. The budget starts
    # small to get baseline runs through; raise -max_total_time only while 6 x budget + relinks
    # stays under the cap, or split the targets into a matrix.
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'weekly'
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true  # the corpus PR step pushes a branch with this token
      - uses: ./.github/actions/yellowback-prereqs
        with:
          apt-extra: clang
          python: 'false'
      - uses: ./.github/actions/yellowback-depends
      - name: Fuzz every target for thirty minutes and minimise the corpus
        run: |
          set -e
          # -fsanitize=fuzzer links libFuzzer's main(), so configure's own "C++ compiler works"
          # program (int main) fails to link with it in CXXFLAGS ("cannot create executables").
          # Instrument with fuzzer-no-link at configure time and add the runtime on the ycashd
          # link alone, the way Bitcoin Core's --with-sanitizers=fuzzer does.
          # config.site sets CC/CXX after the command line (autoconf restores nothing), so every
          # variant builds with depends' clang (22 at 6.20.0) targeting x86_64-pc-linux-gnu, while the LLVM
          # tarball keeps its compiler-rt runtimes (asan, ubsan, profile, fuzzer) under the
          # x86_64-unknown-linux-gnu per-target directory -- the mismatch native_clang.mk already
          # works around for libc++'s __config_site. Without the link the runtime archives are not
          # found and every -fsanitize/--coverage link test fails.
          rt=$(ls -d depends/x86_64-pc-linux-gnu/native/lib/clang/*/lib | head -1)
          ls "$rt"; test -e "$rt/x86_64-pc-linux-gnu" || ln -s x86_64-unknown-linux-gnu "$rt/x86_64-pc-linux-gnu"
          depends/x86_64-pc-linux-gnu/native/bin/clang -target x86_64-pc-linux-gnu -print-file-name=libclang_rt.asan.a
          # BUILD_STAGE=depends exits before autogen.sh, so a checkout has no ./configure.
          # The nightly fuzz step inherits one from the earlier full build; this job does not.
          ./autogen.sh
          # --disable-werror: 6.20.0's configure defaults --enable-werror to yes (v4.5.0: no), and under
          # ZCASH_FUZZ bitcoind.cpp's own '#warning BUILDING A FUZZER' is then an error (-W#warnings).
          CONFIG_SITE="$PWD/depends/x86_64-pc-linux-gnu/share/config.site" ./configure --enable-fuzz-main --disable-werror \
            CXXFLAGS='-fsanitize=fuzzer-no-link,address -DFUZZ_WITH_LIBFUZZER=1' LDFLAGS='-fsanitize=address' \
            || { grep -n -A30 'compiler works\|linker accepts -fsanitize\|accepts --coverage\|accepts -Wl,-z,relro' config.log | tail -160; exit 1; }
          # No full build ran in this job, so the target-only make needs the cxx bridge headers.
          qa/yellowback-cxxbridge-headers.sh . -j$(nproc)
          # Every Yellowback* and Vault* target that has a fuzz.cpp (the vault primitive's target joins
          # when it is ported; ycash-dd has src/fuzzing/Vault), so a new target needs no edit here.
          targets=$(cd src/fuzzing && for d in Yellowback* Vault*; do [ -f "$d/fuzz.cpp" ] && echo "$d"; done; true)  # `; true`: the last glob may match nothing, and bash -e would end the step on that status
          echo "fuzz targets:" $targets
          for t in $targets; do
            # bitcoind.cpp includes fuzz.cpp. Retargeting the symlink does not change the mtime
            # make follows, so each target has to rebuild bitcoind.o or every run fuzzes the first.
            ln -sfn fuzzing/$t/fuzz.cpp src/fuzz.cpp
            # See the nightly fuzz step: retargeting the symlink does not rebuild, and
            # libtool may have left bitcoind.lo and .libs/ycashd beside the .o.
            # The object is src/ycashd-bitcoind.o (ycashd_CPPFLAGS gives it a per-program name); before
            # 2026-09-30 this line missed it, so every target after the first re-linked the first one.
            rm -f src/ycashd-bitcoind.o src/bitcoind.o src/bitcoind.lo src/.libs/bitcoind.o src/ycashd src/.libs/ycashd
            # Overriding ycashd_LDFLAGS also drops 6.20.0's Linux '--whole-archive -ljemalloc' (src/Makefile.am),
            # which is wanted: a jemalloc malloc would shadow ASan's allocator.
            make -C src -j$(nproc) ycashd ycashd_LDFLAGS='$(RELDFLAGS) $(AM_LDFLAGS) $(LIBTOOL_APP_LDFLAGS) -fsanitize=fuzzer,address'
            mkdir -p src/fuzzing/$t/output src/fuzzing/$t/merged src/fuzzing/$t/input src/fuzzing/$t/crashes
            ASAN_OPTIONS=detect_leaks=0 src/ycashd src/fuzzing/$t/output src/fuzzing/$t/input -max_len=4096 -max_total_time=1800 || true
            # Crashes become permanent replay cases; the minimised corpus (seeds + new coverage) replaces input/.
            for c in src/fuzzing/$t/output/crash-*; do [ -f "$c" ] && cp "$c" "src/fuzzing/$t/crashes/$(date +%Y%m%d)-$(basename "$c")"; done
            ASAN_OPTIONS=detect_leaks=0 src/ycashd -merge=1 src/fuzzing/$t/merged src/fuzzing/$t/input src/fuzzing/$t/output
            i=0; for f in src/fuzzing/$t/merged/*; do [ -f "$f" ] || continue; case "$(basename "$f")" in *.bin) ;; *) mv "$f" "src/fuzzing/$t/input/fuzz-$(date +%Y%m%d)-$i.bin"; i=$((i+1));; esac; done
          done
          python3 src/test/gen_yellowback_corpus.py --write || true
          for t in $targets; do git add -f "src/fuzzing/$t/input" "src/fuzzing/$t/crashes"; done
          git add -f src/test/yellowback_fuzz_tests.cpp
          if [ -f src/test/gen_vault_corpus.py ]; then
            python3 src/test/gen_vault_corpus.py --write || true
            git add -f src/test/vault_fuzz_tests.cpp
          fi
      - name: Upload corpus and crashes
        # Also on cancellation: a run that hits the six-hour cap keeps what the finished targets found.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yellowback-weekly-fuzz
          path: |
            src/fuzzing/Yellowback*/input
            src/fuzzing/Yellowback*/crashes
            src/fuzzing/Yellowback*/output/crash-*
            src/fuzzing/Vault*/input
            src/fuzzing/Vault*/crashes
            src/fuzzing/Vault*/output/crash-*
          if-no-files-found: ignore
      - name: Open a PR with the new corpus files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --cached --quiet; then echo "no new corpus files"; exit 0; fi
          branch="weekly-fuzz/$(date +%Y%m%d)"
          git config user.name "yellowback-weekly-fuzz"
          git config user.email "weekly-fuzz@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "fuzz: weekly corpus update ($(date +%Y-%m-%d))"
          git push origin "$branch"
          # The PR goes to the branch this run fuzzed (the dispatcher starts one weekly run per
          # node-line branch). Until 2026-10-06 it was always feature/yellowback, the branch of
          # record, whatever branch had been fuzzed.
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "fuzz: weekly corpus update $(date +%Y-%m-%d)" \
            --body "$(printf '%s\n' \
              '## 1. What and why' '' \
              "Weekly libFuzzer run (30 min per target, run $GITHUB_RUN_ID): the minimised corpus that reached new coverage is added under src/fuzzing/*/input/ and the C++ replay tables src/test/yellowback_fuzz_tests.cpp (and src/test/vault_fuzz_tests.cpp where present) were regenerated by gen_yellowback_corpus.py / gen_vault_corpus.py --write. Maintenance; no code change." '' \
              '## 2. How it was verified' '' \
              "The fuzz targets ran to their time cap in the workflow; the replay table is regenerated from the corpus. **Any file under src/fuzzing/*/crashes/ in this diff is a finding: replay it and fix before merging.** No crashes/ files = merge." '' \
              '## 3. What this PR touches in src/' '' \
              'n/a — no src/ change (src/test/yellowback_fuzz_tests.cpp is generated test data, not code under review)')" || true
      - name: Fail on a crash (the input is already in the artifact, crashes/ and the corpus PR)
        # Each target runs with || true so one crash does not cost the others their 30 minutes; this
        # step turns the run red afterwards instead of reporting a crash as a green run.
        if: always()
        run: |
          if ls src/fuzzing/*/output/crash-* >/dev/null 2>&1; then
            ls -l src/fuzzing/*/output/crash-*
            echo "::error::a fuzz target crashed: replay the input from the artifact (or crashes/ in the corpus PR) and fix"
            exit 1
          fi
          echo "no crashes"
