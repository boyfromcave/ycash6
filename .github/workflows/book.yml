name: zcashd book

on:
  push:
    branches:
      - master

permissions: {}
jobs:
  deploy:
    permissions:
      contents: write # to push pages branch (peaceiris/actions-gh-pages)

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1 (master, 2026-10-01); the stable branch's
        # 2026-10-23 commit is no longer reachable from a branch or tag (zizmor impostor-commit), so master with stable named
        id: toolchain
        with:
          toolchain: stable
      - run: rustup override set "$TOOLCHAIN"
        env:
          TOOLCHAIN: ${{ steps.toolchain.outputs.name }}

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
        with:
          mdbook-version: 'latest'

      - name: Install mdbook-katex
        run: cargo install mdbook-katex

      - name: Build zcashd book
        run: mdbook build doc/book/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/book/book
