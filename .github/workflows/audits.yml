name: Audits

on:
  pull_request:
    # Ycash (2026-10-06): scoped to upstream zcashd's own branch. This fork has no `master` PRs;
    # cargo vet / cargo deny against upstream's supply-chain store cannot vet the fork's git
    # dependency on Ycash's librustzcash fork, so they failed on every fork PR. On the upgrade line
    # (boyfromcave/librustzcash6) that repository's own CI audits that crate graph.
    branches: master
  push:
    branches: master

permissions:
  contents: read

jobs:
  cargo-vet:
    name: Vet Rust dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
      - run: rustup override set ${{steps.toolchain.outputs.name}}
      - run: cargo install cargo-vet --version ~0.10
      - run: cargo vet --locked

  cargo-deny:
    name: Check licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
