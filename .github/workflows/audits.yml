name: Audits

on:
  pull_request:
    # Ycash (2026-10-06): scoped to upstream zcashd's own branch. This fork has no `master` PRs;
    # cargo vet / cargo deny against upstream's supply-chain store cannot vet the fork's git
    # dependency on Ycash's librustzcash fork, so they failed on every fork PR. On the upgrade line
    # (boyfromcave/librustzcash6) that repository's own CI audits that crate graph.
    branches: master
  push:
    branches: master

permissions:
  contents: read

jobs:
  cargo-vet:
    name: Vet Rust dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-23)
        id: toolchain
      - run: rustup override set "$TOOLCHAIN"
        env:
          TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
      - run: cargo install cargo-vet --version ~0.10
      - run: cargo vet --locked

  cargo-deny:
    name: Check licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
