name: Lints

# We only run these lints on trial-merges of PRs to reduce noise.
on:
  pull_request:
    # Ycash (2026-10-06): scoped to upstream zcashd's own branch. This fork has no `master` PRs;
    # upstream's lint scripts (scripted diffs, cargo patches, include guards, shellcheck of
    # upstream's tree) judge upstream conventions this fork deliberately departs from (the Cargo
    # [patch] to Ycash's librustzcash fork), and its clippy action (actions-rs) no longer runs. The Yellowback
    # lint is yellowback-tests.yml's `lint` and `python` jobs.
    branches: master


jobs:
  commit-script-check:
    name: Scripted diffs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check scripted diffs
        run: ./test/lint/commit-script-check.sh ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  general-lints:
    name: General
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install dependencies
        run: sudo python3 -m pip install yq

      - name: Cargo patches
        run: ./test/lint/lint-cargo-patches.sh
        if: always()

      - name: Include guards
        run: ./test/lint/lint-include-guards.sh
        if: always()

      - name: Includes
        run: ./test/lint/lint-includes.sh
        if: always()

      - name: Locale dependence
        run: ./test/lint/lint-locale-dependence.sh
        if: always()
        continue-on-error: true # Temporary until we get this passing

      - name: make dist
        run: ./test/lint/lint-make-dist.sh
        if: always()

      - name: Shebang
        run: ./test/lint/lint-shebang.sh
        if: always()
        continue-on-error: true # Temporary until we get this passing

      - name: Shell locale
        run: ./test/lint/lint-shell-locale.sh
        if: always()
        continue-on-error: true # Temporary until we get this passing

      - name: Shellcheck
        run: ./test/lint/lint-shell.sh
        if: always()

      - name: Whitespace
        run: ./test/lint/lint-whitespace.sh
        if: always()

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install dependencies
        run: sudo python3 -m pip install pyflakes

      - name: Pyflakes
        run: pyflakes qa src zcutil
        if: always()

      - name: UTF-8 encoding
        run: ./test/lint/lint-python-utf8-encoding.sh
        if: always()

  rust-clippy:
    name: Clippy (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Run clippy
        uses: actions-rs/clippy-check@v1
        with:
          name: Clippy (MSRV)
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --all-features --all-targets -- -D warnings

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - run: cargo fmt -- --check
