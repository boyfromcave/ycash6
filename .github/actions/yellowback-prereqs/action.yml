#
# The prerequisites every Yellowback CI job installed by hand before 2026-10-06, in one place:
# the apt build packages (upstream's own list for ubuntu-22.04 plus python3-zmq), and optionally
# Python 3.11 with the pinned test packages of qa/yellowback-ci-requirements.txt (pip cache keyed on
# that file) and the pyblake2 shim.
name: Yellowback CI prerequisites
description: apt build packages and, optionally, the functional-test Python environment
inputs:
  apt:
    description: Install the apt build packages (true/false)
    default: 'true'
  apt-extra:
    description: Extra apt packages (space separated; e.g. clang, lcov)
    default: ''
  python:
    description: Set up Python 3.11 with the pinned test packages (true/false)
    default: 'true'
runs:
  using: composite
  steps:
    - name: apt build packages
      if: inputs.apt == 'true'
      shell: bash
      env:
        EXTRA: ${{ inputs.apt-extra }}
      run: |
        sudo apt-get update -q
        # shellcheck disable=SC2086 # EXTRA is a word list on purpose
        sudo apt-get install -y -q build-essential pkg-config libc6-dev m4 g++-multilib \
          autoconf libtool ncurses-dev unzip git python3 python3-zmq zlib1g-dev curl bsdmainutils \
          automake $EXTRA
    # 3.11, not the runner's 3.10: the quote agent (yellowback_quote, the devnet role presets) reads
    # TOML with the stdlib tomllib. Not newer: the inherited framework still imports asyncore,
    # which 3.12 removed. pyzmq comes from pip because apt's python3-zmq is bound to the runner's
    # interpreter.
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      if: inputs.python == 'true'
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: qa/yellowback-ci-requirements.txt
    - name: Python test packages and the pyblake2 shim
      if: inputs.python == 'true'
      shell: bash
      # The inherited qa/ framework imports simplejson and pyblake2 (unmaintained; the stdlib
      # blake2b has the same API, so a one-line shim stands in for it). No framework file changes.
      run: |
        python3 -m pip install --user -r qa/yellowback-ci-requirements.txt
        site=$(python3 -c 'import site; print(site.getusersitepackages())')
        mkdir -p "$site"
        printf '%s\n' '"""Shim: pyblake2 is unmaintained; Python 3.6+ has hashlib.blake2b with the same API."""' \
                      'from hashlib import blake2b, blake2s  # noqa: F401' > "$site/pyblake2.py"
        python3 -c 'import asyncore, zmq, simplejson, pyblake2, pyflakes, tomllib'
